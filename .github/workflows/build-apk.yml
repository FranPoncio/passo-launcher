name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# Para publicar el APK como descarga directa (Releases)
permissions:
  contents: write

jobs:
  build:
    # ubuntu-24.04 ya trae el SDK de Android instalado
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: SDK de Android (plataforma 36)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Generar proyecto Android y convertirlo en launcher
        run: npm run android:prepare

      - name: Firma fija (para actualizar sin desinstalar ni perder ajustes)
        run: |
          mkdir -p ~/.android
          cp keystore/passo-debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: passo-launcher-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK como descarga directa
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk passo-launcher.apk
          if ! gh release view apk >/dev/null 2>&1; then
            gh release create apk --target "$GITHUB_SHA" \
              --title "Passo Launcher — última versión" \
              --notes "Se actualiza sola con cada compilación. En la tablet: descargá passo-launcher.apk e instalalo encima de la versión anterior."
          fi
          gh release upload apk passo-launcher.apk --clobber
