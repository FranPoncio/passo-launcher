<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Passo Launcher</title>
<link rel="stylesheet" href="lib/leaflet/leaflet.css">
<script src="lib/leaflet/leaflet.js"></script>
<style>
  /* Fuentes locales: el launcher funciona sin internet */
  @font-face { font-family:'Inter'; font-weight:400; src:url(fonts/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:600; src:url(fonts/inter-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:700; src:url(fonts/inter-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:800; src:url(fonts/inter-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:900; src:url(fonts/inter-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family:'JB'; font-weight:700; src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family:'JB'; font-weight:800; src:url(fonts/jetbrains-mono-latin-800-normal.woff2) format('woff2'); }

  /* Tamaños en vh: en 720 px de alto, 1vh = 7,2 px. Mínimo de texto: 2vh (~14 px). */
  :root {
    --bg:#000; --soft:rgba(255,255,255,.07); --soft2:rgba(255,255,255,.12);
    --txt:#fff; --mut:#8b8b94; --mut2:#b4b4bc;
    --ok:#10b981; --ok2:#34d399; --cold:#38bdf8; --bad:#ef4444; --amb:#fbbf24; --acc:#10b981;
  }
  * { box-sizing:border-box; margin:0; padding:0; border:0; outline:0; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  :root { --acc2:#38bdf8; --np:#18181b; }
  html,body { height:100%; background:var(--bg); color:var(--txt); font-family:'Inter',system-ui,sans-serif; overflow:hidden; transition:background .45s; }
  .mono { font-family:'JB',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  body { display:grid; grid-template-rows:8vh 1fr 12.5vh; padding:1.6vh 2.4vh 1.8vh; gap:1.4vh; }
  button { font:inherit; color:inherit; background:none; cursor:pointer; }
  .tap { transition:transform .12s ease-out, opacity .2s; }
  .tap:active { transform:scale(.92); opacity:.85; }
  .pill { background:var(--soft); border-radius:99px; }
  svg.i { fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  svg.f { fill:currentColor; stroke:none; }

  /* ---------- Barra superior ---------- */
  header { display:flex; align-items:center; justify-content:space-between; }
  .hl, .hr { display:flex; align-items:center; gap:2.2vh; }
  .greet { font-weight:800; letter-spacing:.18em; font-size:2.3vh; text-transform:uppercase; }
  .brand { font-weight:800; letter-spacing:.14em; font-size:2.3vh; color:var(--bad); }
  #badge { display:flex; align-items:center; gap:1.1vh; font-size:2vh; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:1.2vh 2.4vh; border-radius:99px; background:rgba(16,185,129,.15); color:var(--ok2); }
  #badge i { width:1.3vh; height:1.3vh; border-radius:50%; background:currentColor; }
  #badge.cold { background:rgba(56,189,248,.14); color:var(--cold); }
  #badge.bad { background:rgba(239,68,68,.22); color:#fca5a5; }
  #badge.sim { background:rgba(251,191,36,.13); color:var(--amb); }
  .hbtn { display:flex; align-items:center; gap:1.1vh; padding:1.4vh 2.6vh; font-size:2.1vh; font-weight:700; color:#e4e4e7; }
  .hbtn svg { width:2.6vh; height:2.6vh; }
  .hicon { width:6.4vh; height:6.4vh; display:flex; align-items:center; justify-content:center; color:var(--mut2); }
  .hicon svg { width:3vh; height:3vh; }
  .hicon.on { color:var(--amb); }
  #clock { font-size:5.2vh; font-weight:800; background:linear-gradient(90deg, #fff 30%, var(--acc2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  /* Brillo de fondo (aurora) en los colores del tema */
  #aura { position:fixed; inset:-20%; z-index:-1; pointer-events:none; opacity:var(--aura,1);
    background:
      radial-gradient(42% 48% at 14% 24%, color-mix(in srgb, var(--acc) 42%, transparent), transparent 70%),
      radial-gradient(44% 50% at 86% 80%, color-mix(in srgb, var(--acc2) 40%, transparent), transparent 70%),
      radial-gradient(34% 34% at 60% 6%, color-mix(in srgb, var(--acc2) 20%, transparent), transparent 70%); }
  body.anim #aura { animation:drift 38s ease-in-out infinite alternate; }
  @keyframes drift { from { transform:translate3d(-3%,-2%,0) rotate(0deg); } to { transform:translate3d(3%,3%,0) rotate(8deg); } }
  .wx { display:none; align-items:center; gap:.9vh; height:6.4vh; padding:0 1.2vh; font-size:2.6vh; font-weight:800; color:#e4e4e7; }
  .wx.on { display:flex; }
  .wx svg { width:3.2vh; height:3.2vh; color:var(--amb); }
  /* Asistente */
  .chat { display:flex; flex-direction:column; gap:1.4vh; margin-bottom:2vh; }
  .msg { max-width:80%; padding:1.8vh 2.4vh; border-radius:2.6vh; font-size:2.6vh; line-height:1.35; font-weight:600; }
  .msg.u { align-self:flex-end; background:var(--soft2); color:#e4e4e7; }
  .msg.a { align-self:flex-start; background:color-mix(in srgb, var(--acc) 18%, transparent); color:#fff; }
  .msg.w { align-self:flex-start; color:var(--mut2); }
  .bigmic { width:14vh; height:14vh; border-radius:50%; background:var(--acc); color:#000; display:flex; align-items:center; justify-content:center; margin:0 auto; }
  .bigmic svg { width:6vh; height:6vh; }
  .hint { text-align:center; color:var(--mut); font-size:2.1vh; font-weight:700; margin-top:1.4vh; }
  .chips { display:flex; gap:1.2vh; flex-wrap:wrap; justify-content:center; margin-top:2vh; }
  .chips button { padding:1.4vh 2.4vh; border-radius:99px; background:var(--soft); font-size:2.1vh; font-weight:700; color:#e4e4e7; }
  input.wide { width:46vh; }

  /* ---------- Centro de la pantalla ---------- */
  main { display:grid; grid-template-columns:23% 1fr 21%; gap:2.4vh; min-height:0; }
  main.lhd > :nth-child(1) { order:3; } main.lhd > :nth-child(3) { order:1; }
  .col { display:flex; flex-direction:column; align-items:center; justify-content:space-evenly; min-height:0; }

  /* Izquierda: velocidad + auto chico */
  .gauge { position:relative; width:100%; max-width:34vh; aspect-ratio:1/.8; }
  .gauge svg { width:100%; height:100%; overflow:visible; }
  .gauge .c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:10%; }
  #speed { font-size:12.5vh; font-weight:900; line-height:.88; letter-spacing:-.05em; }
  .unit { font-size:2vh; letter-spacing:.2em; color:var(--mut); font-weight:800; text-transform:uppercase; margin-top:1vh; }
  #obdLine { display:none; width:100%; justify-content:space-around; }
  #obdLine.on { display:flex; }
  #obdLine span { display:flex; flex-direction:column; align-items:center; white-space:nowrap; }
  #obdLine b { font-size:3vh; font-weight:800; }
  #obdLine small { font-size:1.9vh; color:var(--mut); font-family:'Inter',sans-serif; font-weight:800; letter-spacing:.1em; text-transform:uppercase; }
  #obdLine #rpm { color:var(--ok2); }
  .car { position:relative; width:100%; max-width:30vh; }
  .car img { display:block; width:100%; height:auto; position:relative; z-index:1; }
  .car img.own { aspect-ratio:738/391; object-fit:cover; border-radius:2vh; -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%, #000 55%, transparent 100%); mask-image:radial-gradient(ellipse 70% 70% at 50% 50%, #000 55%, transparent 100%); }
  .car .floor { position:absolute; left:6%; right:4%; bottom:-.8vh; height:2.6vh; border-radius:50%; background:radial-gradient(ellipse at center, color-mix(in srgb, var(--acc) 45%, transparent), transparent 70%); filter:blur(.8vh); z-index:0; }
  #alerts { min-height:4vh; display:flex; gap:1vh; flex-wrap:wrap; justify-content:center; }
  #alerts span { font-size:2vh; font-weight:800; padding:.9vh 2vh; border-radius:99px; background:rgba(251,191,36,.13); color:var(--amb); text-align:center; }
  #alerts span.r { background:rgba(239,68,68,.2); color:#fca5a5; }

  /* Centro: mapa grande + música grande */
  .center { display:flex; flex-direction:column; gap:1.4vh; min-height:0; }
  .mapcard { position:relative; isolation:isolate; z-index:0; flex:1; min-height:0; border-radius:3.2vh; overflow:hidden; background:#0c0e12; box-shadow:0 0 0 1px color-mix(in srgb, var(--acc) 35%, transparent), 0 2vh 6vh color-mix(in srgb, var(--acc) 18%, transparent); }
  #map { position:absolute; inset:0; background:#0c0e12; }
  .leaflet-tile-pane { filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.88) saturate(.55); }
  .leaflet-control-attribution { background:rgba(0,0,0,.55) !important; color:#71717a !important; font-size:1.3vh !important; }
  .leaflet-control-attribution a { color:#a1a1aa !important; }
  .mapmsg { position:absolute; inset:0 0 40% 0; display:flex; align-items:center; justify-content:center; text-align:center; padding:0 6vh; font-size:2.1vh; font-weight:700; color:var(--mut); pointer-events:none; }
  .mapnav { position:absolute; top:1.6vh; left:1.6vh; z-index:500; display:flex; align-items:center; gap:1.1vh; padding:1.4vh 2.4vh; font-size:2.1vh; font-weight:800; color:#fff; background:rgba(10,10,12,.82); }
  .mapnav svg { width:2.6vh; height:2.6vh; color:var(--ok2); }
  .recenter { position:absolute; top:1.6vh; right:1.6vh; z-index:500; width:7vh; height:7vh; border-radius:50%; background:rgba(10,10,12,.82); display:none; align-items:center; justify-content:center; color:#fff; }
  .recenter svg { width:3vh; height:3vh; }
  .me { width:2.6vh; height:2.6vh; border-radius:50%; background:var(--acc); box-shadow:0 0 0 .7vh color-mix(in srgb, var(--acc) 35%, transparent), 0 0 2vh var(--acc); }
  .pk { width:3.4vh; height:3.4vh; border-radius:1vh; background:#2563eb; color:#fff; font-weight:900; font-size:2vh; display:flex; align-items:center; justify-content:center; }

  .np { position:absolute; left:1.4vh; right:1.4vh; bottom:1.4vh; z-index:500; background:linear-gradient(110deg, color-mix(in srgb, var(--np) 70%, #0c0c0e) 0%, rgba(12,12,14,.93) 62%); box-shadow:0 1vh 4vh color-mix(in srgb, var(--np) 35%, transparent); transition:background .8s; border-radius:2.8vh; padding:1.6vh; display:grid; grid-template-columns:13vh 1fr auto; gap:2.2vh; align-items:center; }
  .np .art { width:13vh; height:13vh; border-radius:2vh; background:var(--soft2) center/cover no-repeat; display:flex; align-items:center; justify-content:center; color:var(--mut2); }
  .np .art svg { width:5vh; height:5vh; }
  .np .meta { min-width:0; }
  .np .t { font-size:3vh; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .np .a { font-size:2.2vh; color:var(--mut2); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:.5vh; }
  .np .bar { height:.7vh; border-radius:99px; background:var(--soft2); margin-top:1.6vh; overflow:hidden; }
  .np .bar i { display:block; height:100%; width:0; background:linear-gradient(90deg, var(--acc), var(--acc2)); border-radius:99px; transition:width 1s linear; }
  .np .ctl { display:flex; align-items:center; gap:.6vh; }
  .np .ctl button { width:8.5vh; height:9vh; display:flex; align-items:center; justify-content:center; color:#e4e4e7; }
  .np .ctl button svg { width:3.8vh; height:3.8vh; }
  .np .ctl .pp { width:10vh; height:10vh; border-radius:50%; background:#fff; color:#000; }
  .np .ctl .pp svg { width:4vh; height:4vh; }
  .np .perm { font-size:2.1vh; font-weight:800; color:var(--amb); padding:2vh 3vh; border-radius:99px; background:rgba(251,191,36,.12); }

  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:1.4vh; }
  .stat { --c:var(--acc); background:linear-gradient(160deg, color-mix(in srgb, var(--c) 20%, transparent), color-mix(in srgb, var(--c) 6%, transparent)); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 25%, transparent); border-radius:2.4vh; padding:1.4vh 1vh; text-align:center; }
  .stat small { display:block; font-size:1.9vh; letter-spacing:.12em; color:color-mix(in srgb, var(--c) 75%, #fff); font-weight:800; text-transform:uppercase; }
  .stat b { display:block; font-size:2.8vh; font-weight:800; margin-top:.5vh; white-space:nowrap; }
  .stat b.warn { color:var(--amb); } .stat b.bad { color:#f87171; } .stat b.good { color:var(--ok2); }

  /* Derecha: apps */
  .apps { display:grid; grid-template-columns:repeat(2,1fr); gap:3.6vh 1.4vh; width:100%; }
  .app { display:flex; flex-direction:column; align-items:center; gap:1.2vh; font-size:2.1vh; font-weight:700; color:#e4e4e7; padding:.6vh 0; }
  .app .ico { width:9vh; height:9vh; display:flex; align-items:center; justify-content:center; }
  .app img { width:9vh; height:9vh; border-radius:2.4vh; object-fit:cover; transition:filter .3s; box-shadow:0 1vh 2.6vh color-mix(in srgb, var(--c) 40%, transparent); }
  .fb { width:9vh; height:9vh; border-radius:2.6vh; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--c) 16%, transparent); color:var(--c); }
  .fb svg { width:4.4vh; height:4.4vh; }
  body.mono-ic .app img, body.mono-ic .dr img, body.mono-ic .dk img { filter:grayscale(1) brightness(1.15); }
  body.mono-ic .fb { background:var(--soft); color:#e4e4e7; }
  .work { width:100%; display:flex; align-items:center; justify-content:center; gap:1.3vh; padding:2.2vh; font-size:2.1vh; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--amb); }
  .work svg { width:2.8vh; height:2.8vh; }
  .work.on { background:rgba(251,191,36,.16); }

  /* ---------- Dock inferior ---------- */
  footer { display:flex; align-items:center; justify-content:space-between; gap:2vh; }
  .side { display:flex; align-items:center; gap:1.3vh; height:100%; padding:0 3vh; font-size:2.1vh; font-weight:800; color:#e4e4e7; }
  .side svg { width:3vh; height:3vh; }
  .dock { display:flex; align-items:center; gap:1vh; height:100%; padding:1.1vh; border-radius:99px; background:var(--soft); }
  .dk { display:flex; align-items:center; gap:1.2vh; height:100%; padding:0 2.8vh; border-radius:99px; font-size:2.2vh; font-weight:800; color:var(--c); white-space:nowrap; background:color-mix(in srgb, var(--c) 12%, transparent); }
  .dk svg { width:3.2vh; height:3.2vh; }
  .dk img { width:4.4vh; height:4.4vh; border-radius:1.1vh; }
  .dk.main { background:linear-gradient(100deg, var(--acc), var(--acc2)); color:#05060a; box-shadow:0 1vh 3vh color-mix(in srgb, var(--acc) 40%, transparent); }
  .allapps { height:100%; aspect-ratio:1; border-radius:50%; background:#fff; color:#000; display:flex; align-items:center; justify-content:center; }
  .allapps svg { width:3.4vh; height:3.4vh; }

  /* ---------- Paneles ---------- */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.97); display:none; flex-direction:column; padding:4vh 7vh; z-index:2000; overflow:auto; }
  #modal.on { display:flex; animation:up .22s ease-out; }
  @keyframes up { from { opacity:0; transform:translateY(2vh); } to { opacity:1; transform:none; } }
  #modal h2 { font-size:3.6vh; font-weight:900; margin-bottom:2.4vh; }
  #modal h2 small { font-size:2.2vh; color:var(--mut); font-weight:700; margin-left:1vh; }
  #modal .x { position:fixed; right:4vh; top:3vh; width:8vh; height:8vh; border-radius:50%; background:var(--soft2); display:flex; align-items:center; justify-content:center; }
  #modal .x svg { width:3.2vh; height:3.2vh; }
  .item { display:flex; align-items:center; justify-content:space-between; gap:1.6vh; padding:2vh 2.4vh; background:var(--soft); border-radius:2.6vh; margin-bottom:1.2vh; font-weight:700; font-size:2.3vh; }
  .item small { color:var(--mut); font-weight:600; display:block; margin-top:.4vh; font-size:2vh; }
  .item b { font-size:2.6vh; }
  .btn { min-height:6.8vh; padding:0 3vh; border-radius:99px; background:var(--soft2); font-weight:800; font-size:2vh; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; }
  .btn.go { background:var(--ok); color:#022c22; } .btn.stop { background:#dc2626; color:#fff; } .btn.amb { background:rgba(251,191,36,.18); color:var(--amb); }
  .row { display:flex; gap:1.2vh; align-items:center; }
  .row > .btn { flex:1; }
  input { background:var(--soft2); color:#fff; border-radius:1.8vh; padding:0 2vh; height:6.8vh; font:inherit; font-size:2.3vh; width:26vh; color-scheme:dark; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:1.4vh; }
  .big { text-align:center; padding:2.2vh; background:var(--soft); border-radius:2.6vh; }
  .big b { display:block; font-size:4.4vh; font-weight:900; }
  .big small { font-size:1.9vh; letter-spacing:.12em; color:var(--mut); font-weight:800; text-transform:uppercase; }
  .drawer { display:grid; grid-template-columns:repeat(6,1fr); gap:4.4vh 2vh; padding:1vh 0 3vh; }
  .dr { display:flex; flex-direction:column; align-items:center; gap:1.3vh; font-size:2.1vh; font-weight:700; color:#e4e4e7; text-align:center; }
  .dr img, .dr .fb { width:9.5vh; height:9.5vh; border-radius:2.6vh; }
  .swatches { display:flex; gap:1.3vh; }
  .sw { width:6.8vh; height:6.8vh; border-radius:2vh; background:var(--s); box-shadow:inset 0 0 0 2px #3f3f46; }
  .sw.on { box-shadow:inset 0 0 0 5px var(--ok); }
  .seg { display:flex; gap:.8vh; background:var(--soft); padding:.8vh; border-radius:99px; }
  .seg button { min-height:5.6vh; padding:0 2.4vh; border-radius:99px; font-size:2vh; font-weight:800; color:var(--mut2); }
  .seg button.on { background:#fff; color:#000; }
  .dtc { display:flex; gap:2vh; align-items:center; padding:2vh 2.2vh; background:var(--soft); border-radius:2.2vh; margin-bottom:1.1vh; }
  .dtc b { font-size:2.8vh; font-weight:900; color:var(--amb); min-width:12vh; }
  .dtc span { font-weight:600; color:#d4d4d8; font-size:2.2vh; }

  #toast { position:fixed; top:2vh; left:50%; transform:translate(-50%,-1vh); background:#27272a; padding:1.6vh 3vh; border-radius:99px; font-size:2.2vh; font-weight:800; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:2100; display:flex; align-items:center; gap:1.4vh; white-space:nowrap; }
  #toast.on { opacity:1; transform:translate(-50%,0); }
  #toast i { width:1.4vh; height:1.4vh; border-radius:50%; background:var(--ok); }
  #toast.warn i { background:var(--amb); } #toast.err i { background:var(--bad); }
  #night { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity 1.2s; z-index:3000; }
  #danger { position:fixed; inset:0; pointer-events:none; z-index:1500; display:none; background:radial-gradient(circle,transparent 55%,rgba(239,68,68,.45) 100%); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:0} 50%{opacity:1} }
</style>
</head>
<body>
<div id="aura"></div><div id="night"></div><div id="danger"></div><div id="toast"><i></i><span id="toastTxt"></span></div>

<header>
  <div class="hl">
    <span class="greet" id="greet"></span>
    <span class="brand">PASSO 1.3</span>
    <button id="badge" class="tap sim" onclick="openObd()"><i></i><span id="badgeTxt">Sin OBD</span></button>
  </div>
  <div class="hr">
    <button class="tap pill hbtn" onclick="parkingTap()" data-ic="pin"><span id="parkLbl">Parking</span></button>
 <button class="tap wx" id="wx" onclick="openWeather()"><span id="wxIco"></span><span id="wxT" class="mono"></span></button>
    <button class="tap hicon" id="nightBtn" onclick="cycleNight()" data-ic="moon" aria-label="Modo noche"></button>
    <div id="clock" class="mono">--:--</div>
  </div>
</header>

<main>
  <!-- Izquierda: velocidad + auto chico -->
  <section class="col">
    <div class="gauge tap" onclick="openObd()">
      <svg viewBox="0 0 200 150">
        <defs><linearGradient id="arcG" x1="0" y1="1" x2="1" y2="0"><stop offset="0" style="stop-color:var(--acc)"/><stop offset="1" style="stop-color:var(--acc2)"/></linearGradient></defs>
        <path d="M 25 130 A 80 80 0 1 1 175 130" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="11" stroke-linecap="round"/>
        <path id="arc" d="M 25 130 A 80 80 0 1 1 175 130" fill="none" stroke="url(#arcG)" stroke-width="11" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330" style="transition:stroke-dashoffset .3s,stroke .3s"/>
      </svg>
      <div class="c">
        <div id="speed">0</div>
        <div class="unit">km/h</div>
      </div>
    </div>
    <div id="obdLine" class="mono">
      <span><b id="rpm">--</b><small>rpm</small></span><span><b id="temp">--</b><small>agua</small></span><span><b id="volt">--</b><small>bat.</small></span><span id="consBox"><b id="cons">--</b><small>L/100</small></span>
    </div>

/* ================= Plugins nativos ================= */
function plugin(name){
  const C = window.Capacitor;
  if (!C || !C.isNativePlatform || !C.isNativePlatform()) return null;
  return (C.Plugins && C.Plugins[name]) || (C.registerPlugin ? C.registerPlugin(name) : null);
}

/* ================= Lanzar apps ================= */
function openApp(pkg){
  const AL = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AppLauncher;
  if (AL) AL.openUrl({ url: pkg }).catch(()=>toast('No está instalada: '+pkg,'warn'));
  else toast('Solo funciona dentro de la app (APK)','warn');
}

const media = { active:false, title:'', artist:'', art:'', playing:false, pos:0, dur:0, pkg:'', noAccess:false };
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function renderNp(){
  const np=$('np'), P=plugin('Media');
  if (P && media.noAccess) {
    np.innerHTML = `<div class="art">${svg('music')}</div><div class="meta"><div class="t">Música</div><div class="a">Falta un permiso</div></div>
      <button class="perm tap" onclick="askMediaAccess()">Activar control de música</button>`;
    return;
  }
  const pct = media.dur>0 ? Math.min(100, media.pos/media.dur*100) : 0;
  np.innerHTML = `
    <button class="art tap" onclick="openApp(musicPkg())" style="${media.art?`background-image:url(${media.art})`:''}">${media.art?'':svg('music')}</button>
    <button class="meta tap" style="text-align:left" onclick="openApp(musicPkg())">
      <div class="t">${media.active && media.title ? esc(media.title) : 'Nada sonando'}</div>
      <div class="a">${media.active ? esc(media.artist||'') : 'Tocá para abrir la música'}</div>
      <div class="bar"><i style="width:${pct}%"></i></div>
    </button>
    <div class="ctl">
      <button class="tap" onclick="mediaCtl('prev')" aria-label="Anterior">${fsvg('prev')}</button>
      <button class="tap pp" onclick="mediaCtl('toggle')" aria-label="Play o pausa">${fsvg(media.playing?'pause':'play')}</button>
      <button class="tap" onclick="mediaCtl('next')" aria-label="Siguiente">${fsvg('next')}</button>
    </div>`;
}
function artColor(src){
  const R=document.documentElement.style;
  if(!src){ R.setProperty('--np', 'var(--acc)'); return; }
  const img=new Image(); img.onload=()=>{ try{
    const c=document.createElement('canvas'); c.width=c.height=16; const g=c.getContext('2d'); g.drawImage(img,0,0,16,16);
    const d=g.getImageData(0,0,16,16).data; let r=0,gg=0,b=0,n=0;
    for(let i=0;i<d.length;i+=4){ const mx=Math.max(d[i],d[i+1],d[i+2]), mn=Math.min(d[i],d[i+1],d[i+2]); const w=(mx-mn)+8; r+=d[i]*w; gg+=d[i+1]*w; b+=d[i+2]*w; n+=w; }
    R.setProperty('--np', `rgb(${Math.round(r/n)},${Math.round(gg/n)},${Math.round(b/n)})`);
  }catch(e){} }; img.src=src;
}
async function pollMedia(){
  const P=plugin('Media'); if(!P) return;
  try {
    const r = await P.get({ known: media.title });
    const key = () => JSON.stringify([media.active,media.title,media.artist,media.playing,media.noAccess,media.art.length]);
    const before = key();
    media.noAccess = !!r.noAccess; media.active = !!r.active;
    if (r.active) {
      if (r.art !== undefined) { media.art = r.art || ''; artColor(media.art); }
      media.title = r.title||''; media.artist = r.artist||''; media.playing = !!r.playing;
      media.pos = r.position||0; media.dur = r.duration||0; media.pkg = r.pkg||'';
    }
    if (before!==key()) renderNp();
    else { const bar=document.querySelector('.np .bar i'); if(bar && media.dur>0) bar.style.width=Math.min(100,media.pos/media.dur*100)+'%'; }
  } catch(e){}
}
async function mediaCtl(a){
  const P=plugin('Media');
  if(!P){ toast('Controles de música solo en la APK','warn'); return; }
  if(media.noAccess){ askMediaAccess(); return; }
  try { await P.control({ action:a }); setTimeout(pollMedia,300); }
  catch(e){ openApp(musicPkg()); }
}
function askMediaAccess(){
  const P=plugin('Media'); if(!P) return;

}

/* ================= Modo noche: automático con la puesta del sol ================= */
function sunTimes(date, lat, lon){
  const rad=Math.PI/180, J = date.getTime()/864e5 + 2440587.5;
  const n = Math.round(J - 2451545.0 + 0.0008), Js = n - lon/360;
  const M = (357.5291 + 0.98560028*Js) % 360;
  const C = 1.9148*Math.sin(M*rad) + 0.02*Math.sin(2*M*rad) + 0.0003*Math.sin(3*M*rad);
  const L = (M + C + 180 + 102.9372) % 360;
  const Jt = 2451545 + Js + 0.0053*Math.sin(M*rad) - 0.0069*Math.sin(2*L*rad);
  const d = Math.asin(Math.sin(L*rad)*Math.sin(23.4397*rad));
  const w = Math.acos((Math.sin(-0.833*rad) - Math.sin(lat*rad)*Math.sin(d)) / (Math.cos(lat*rad)*Math.cos(d))) / rad;
  const toDate = j => new Date((j - 2440587.5)*864e5);
  return { rise: toDate(Jt - w/360), set: toDate(Jt + w/360) };
}
function isDark(){
  const pos = gpsLast || S.lastPos, now = new Date();
  if (!pos) { const h = now.getHours(); return h >= 19 || h < 7; } // sin GPS todavía: por horario
  const t = sunTimes(now, pos.lat, pos.lon);
  return now < new Date(t.rise.getTime()+20*6e4) || now > new Date(t.set.getTime()-10*6e4);
}
function applyNight(){
  const on = S.night==='on' || (S.night==='auto' && isDark());
  $('night').style.opacity = on ? .45 : 0;

let gpsLast=null, speedKmh=0;
function hav(a,b,c,d){ const R=6371,r=x=>x*Math.PI/180; const dl=r(c-a),dn=r(d-b); const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function showSpeed(){
  const v = Math.round(speedKmh<3?0:speedKmh);
  $('speed').textContent = v;
  if (!obd.ok) { const arc=$('arc'); arc.style.strokeDashoffset = 330-330*Math.min(1,v/120); arc.setAttribute('stroke', 'url(#arcG)'); }
}
if (navigator.geolocation) {
  navigator.geolocation.watchPosition(p=>{
    const c=p.coords;
    speedKmh = c.speed!=null && !isNaN(c.speed) ? Math.max(0,c.speed*3.6) : speedKmh;
    if (c.accuracy<=30) {
      if (gpsLast) { const d=hav(gpsLast.lat,gpsLast.lon,c.latitude,c.longitude); if (d>0.005 && d<1) { S.odo+=d; } }
      gpsLast={lat:c.latitude,lon:c.longitude}; S.lastPos=gpsLast;
      updateMap(c.latitude,c.longitude);
      if (!wxAt || Date.now()-wxAt > 20*6e4) loadWeather();

}

/* ================= OBD2 (ELM327 Bluetooth clásico) ================= */
const obd = { rpm:null, temp:null, volt:null, maf:null, iat:null, mil:null, dtcCount:null, proto:'', ok:false, sim:false };
let BT = window.bluetoothSerial;
let buf='', waiter=null, pollTimer=null, pollN=0;
let cmdQueue = Promise.resolve();
function cmd(c, ms){ const p = cmdQueue.then(()=>btWrite(c, ms)); cmdQueue = p.catch(()=>{}); return p; }
function btWrite(cmd, ms){
  return new Promise(res=>{
    waiter = res; buf='';
    BT.write(cmd+'\r', ()=>{}, ()=>{ waiter=null; res(''); });
    setTimeout(()=>{ if(waiter===res){ waiter=null; res(buf); } }, ms||1500);
  });
}
function parseHex(resp, pid){
  const s = resp.replace(/[\s>]/g,'').toUpperCase();
  const k = '41'+pid; const i = s.indexOf(k);
  if (i<0) return null;
  const h = s.slice(i+k.length); const out=[];
  for (let j=0;j+1<h.length;j+=2) out.push(parseInt(h.substr(j,2),16));
  return out;
}
async function obdInit(){
  await cmd('ATZ', 4000);
  for (const c of ['ATE0','ATL0','ATS0','ATH0','ATSP0']) await cmd(c);
  await cmd('0100', 10000);
  obd.proto = (await cmd('ATDPN')).replace(/[\s>]/g,'').toUpperCase();
}
async function obdPoll(){
  let r;
  r = parseHex(await cmd('010C'),'0C'); if(r&&r.length>=2) obd.rpm = ((r[0]*256)+r[1])/4;
  r = parseHex(await cmd('0105'),'05'); if(r&&r.length>=1) obd.temp = r[0]-40;
  r = parseHex(await cmd('0142'),'42'); if(r&&r.length>=2) obd.volt = ((r[0]*256)+r[1])/1000;
  r = parseHex(await cmd('0110'),'10'); obd.maf = (r&&r.length>=2) ? ((r[0]*256)+r[1])/100 : null;
  if (pollN % 5 === 0) { r = parseHex(await cmd('010F'),'0F'); obd.iat = (r&&r.length>=1) ? r[0]-40 : null; }
  if (pollN % 25 === 0) { r = parseHex(await cmd('0101'),'01'); if(r&&r.length>=1){ obd.mil = !!(r[0]&0x80); obd.dtcCount = r[0]&0x7F; } }
  pollN++;
  obd.ok = true; renderObd();
}

/* ---------- Códigos de falla (DTC): modo 03 leer, modo 04 borrar ---------- */
const DTC_INFO = {
  P0100:'Sensor MAF (caudal de aire): falla de circuito', P0101:'Sensor MAF: lectura fuera de rango', P0102:'Sensor MAF: señal baja', P0103:'Sensor MAF: señal alta',
  P0110:'Sensor de temperatura de admisión: falla de circuito', P0115:'Sensor de temperatura del refrigerante: falla de circuito', P0116:'Sensor de temperatura del refrigerante: lectura fuera de rango',
  P0120:'Sensor de posición del acelerador (TPS): falla de circuito', P0125:'El motor tarda en llegar a temperatura (revisar termostato)', P0128:'Termostato: temperatura del refrigerante por debajo de lo normal',
  P0130:'Sonda lambda (antes del catalizador): falla de circuito', P0133:'Sonda lambda (antes del catalizador): respuesta lenta', P0135:'Sonda lambda (antes del catalizador): falla del calefactor',
  P0136:'Sonda lambda (después del catalizador): falla de circuito', P0141:'Sonda lambda (después del catalizador): falla del calefactor',
  P0171:'Mezcla demasiado pobre (posible entrada de aire o MAF sucio)', P0172:'Mezcla demasiado rica',
  P0300:'Fallo de encendido aleatorio', P0301:'Fallo de encendido en cilindro 1', P0302:'Fallo de encendido en cilindro 2', P0303:'Fallo de encendido en cilindro 3', P0304:'Fallo de encendido en cilindro 4',
  P0325:'Sensor de detonación: falla de circuito', P0335:'Sensor de posición del cigüeñal: falla de circuito', P0340:'Sensor de posición del árbol de levas: falla de circuito',
  P0420:'Eficiencia del catalizador por debajo del mínimo', P0440:'Sistema de evaporación (EVAP): falla', P0441:'EVAP: flujo de purga incorrecto', P0442:'EVAP: pérdida chica (revisar tapa de nafta)',
  P0446:'EVAP: falla en el control de ventilación', P0455:'EVAP: pérdida grande (revisar tapa de nafta)', P0500:'Sensor de velocidad del vehículo: falla',
  P0505:'Sistema de control de ralentí: falla', P0560:'Voltaje del sistema: falla', P0700:'La caja automática reporta una falla (leer su propio código)'
};
function dtcDesc(c){
  if (DTC_INFO[c]) return DTC_INFO[c];
  if (/^P1/.test(c)) return 'Código propio de Toyota/Daihatsu: buscalo junto con "Passo"';
  return 'Buscalo en internet con el código exacto';
}
function decodeDtc(a,b){
  if (a===0 && b===0) return null;
  return 'PCBU'[a>>6] + ((a>>4)&3) + (a&15).toString(16).toUpperCase() + b.toString(16).toUpperCase().padStart(2,'0');
}
function parseDtcResponse(resp){
  if (/NO ?DATA/i.test(resp)) return [];
  const isCan = /^A?[6-9AB]$/.test(obd.proto);
  const lines = resp.toUpperCase().split(/[\r\n]+/)
    .map(l=>l.replace(/^\s*[0-9A-F]:/,'').replace(/[\s>]/g,''))
    .filter(l=>/^[0-9A-F]+$/.test(l) && l.length>3);
  const bytes = [];
  if (isCan) {
    const all = lines.join(''); const i = all.indexOf('43'); if (i<0) return null;
    const h = all.slice(i+4);
    for (let j=0;j+1<h.length;j+=2) bytes.push(parseInt(h.substr(j,2),16));
  } else {
    let found=false;
    lines.forEach(l=>{ if(!l.startsWith('43')) return; found=true; const h=l.slice(2,14); for(let j=0;j+1<h.length;j+=2) bytes.push(parseInt(h.substr(j,2),16)); });
    if (!found) return null;
  }
  const codes=[];
  for (let j=0;j+1<bytes.length;j+=2){ const c=decodeDtc(bytes[j],bytes[j+1]); if(c && !codes.includes(c)) codes.push(c); }
  return codes;
}
async function scanDtc(){
  if (obd.sim) { toast('Modo demo: no hay auto conectado para escanear','warn'); return; }
  if (!BT || !obd.ok) { toast('Conectá el OBD primero','warn'); return; }
  $('dtcBox').innerHTML = '<div class="item">Leyendo la ECU…</div>';
  const resp = await cmd('03', 8000);
  const codes = parseDtcResponse(resp);
  if (codes === null) {
    $('dtcBox').innerHTML = `<div class="item"><span>La ECU no respondió al pedido de códigos<small>Respuesta: ${esc(resp.replace(/[\r\n>]+/g,' ').trim().slice(0,60))||'(vacía)'}. Probá con el motor en contacto.</small></span></div>`;
    return;
  }
  S.lastScan = { t:Date.now(), codes }; save();
  renderDtc();
}
function renderDtc(){
  const s=S.lastScan, box=$('dtcBox'); if(!box) return; if(!s){ box.innerHTML=''; return; }
  const when = new Date(s.t).toLocaleString('es-AR');
  box.innerHTML = s.codes.length
    ? s.codes.map(c=>`<div class="dtc"><b>${c}</b><span>${dtcDesc(c)}</span></div>`).join('') +
      `<div class="item"><span>Borrar códigos<small>Apaga el check engine, pero no arregla la causa: si la falla sigue, el código vuelve.</small></span><button class="btn stop tap" onclick="clearDtc()">Borrar</button></div>` +
      `<small style="color:var(--mut);font-size:2vh">Escaneo: ${when}</small>`
    : `<div class="item"><span>Sin códigos de falla guardados<small>Escaneo: ${when}</small></span></div>`;
}
async function clearDtc(){
  if (!confirm('¿Borrar los códigos de falla? Hacelo con el motor en contacto (sin arrancar). El check engine se apaga, pero si el problema sigue, vuelve a aparecer.')) return;
  const r = await cmd('04', 8000);
  if (/44/.test(r.replace(/\s/g,''))) { toast('Códigos borrados'); S.lastScan={t:Date.now(),codes:[]}; save(); renderDtc(); }
  else toast('La ECU no aceptó el borrado','err');
}
function connectObd(addr){
  if(!BT){ toast('OBD real solo en la APK. Usá modo demo.','warn'); return; }
  BT.connect(addr, async ()=>{
    S.obdAddr=addr; save();
    BT.subscribe('>', d=>{ buf+=d; if(waiter){ const w=waiter; waiter=null; w(buf);} });
    await obdInit(); obd.sim=false; clearInterval(pollTimer);
    const loop=async()=>{ try{ await obdPoll(); }catch(e){} pollTimer=setTimeout(loop,400); }; loop();
    toast('OBD conectado'); closeModal();
  }, ()=>{ toast('No pude conectar al OBD','err'); obd.ok=false; renderObd(); });
}
function startSim(){
  obd.sim=true; clearInterval(pollTimer);
  let t=0; pollTimer=setInterval(()=>{ t+=0.1;
    obd.rpm=1200+Math.abs(Math.sin(t))*2200; obd.temp=Math.min(91,60+t*2); obd.volt=14.1-Math.random()*.1; obd.maf=3+Math.abs(Math.sin(t))*8; obd.ok=true;

}
function renderObd(){
  const rpm=obd.rpm, t=obd.temp, v=obd.volt;

  $('cons').textContent = c || '--'; $('consBox').style.display = obd.maf!=null ? '' : 'none';

  if(obd.sim || !obd.ok) b.classList.add('sim');
  if(obd.mil && !hot && !obd.sim) b.className='tap bad';

/* ================= Viajes: km, tiempo y costo ================= */
const curFmt = n => (S.cur||'$') + (n>=100 ? Math.round(n) : n.toFixed(2));
function avgCons(){
  const full=S.fuel.filter(x=>x.full);
  if(full.length>=2){ const km=full[full.length-1].odo-full[0].odo, L=full.slice(1).reduce((s,x)=>s+x.liters,0); if(km>50) return L/km*100; }
  return S.consEst||6.5;
}
const tripCost = km => km*avgCons()/100*(S.fuelPrice||0);
function tripTick(){
  const now=Date.now();
  if (speedKmh>5) {
    if(!S.trip) S.trip={ start:now, km0:S.odo, last:now };
    else S.trip.last=now;
  }
  renderTripStat();
}
function closeTripIfIdle(){
  if(!S.trip) return;
  if(Date.now()-S.trip.last > 5*6e4){
    const km=S.odo-S.trip.km0;
    if(km>0.2) S.trips.push({ start:S.trip.start, end:S.trip.last, km });
    if(S.trips.length>300) S.trips=S.trips.slice(-300);
    S.trip=null; save(); renderTripStat();
  }
}
setInterval(closeTripIfIdle, 30000);
const durFmt = ms => { const m=Math.round(ms/6e4); return m<60 ? m+' min' : Math.floor(m/60)+' h '+(m%60)+' min'; };
function renderTripStat(){
  const el=$('stTrip'); if(!el) return;
  if(S.trip){ el.textContent=(S.odo-S.trip.km0).toFixed(1)+' km'; el.className='mono good'; }
  else { const l=S.trips[S.trips.length-1]; el.textContent = l ? l.km.toFixed(1)+' km' : '--'; el.className='mono'; }
}
function openTrips(){
  const now=new Date(), m0=new Date(now.getFullYear(),now.getMonth(),1).getTime(), d0=new Date(now.getFullYear(),now.getMonth(),now.getDate()).getTime();
  const sum=(from)=>{ const t=S.trips.filter(x=>x.start>=from); return { km:t.reduce((a,x)=>a+x.km,0), ms:t.reduce((a,x)=>a+(x.end-x.start),0), n:t.length }; };
  const today=sum(d0), month=sum(m0);
  const cur=S.trip ? { km:S.odo-S.trip.km0, ms:Date.now()-S.trip.start } : null;
  openModal(`<h2>Viajes <small>consumo usado: ${avgCons().toFixed(1)} L/100 · nafta ${curFmt(S.fuelPrice||0)}/L</small></h2>
    <div class="grid4" style="margin-bottom:1.6vh">
      <div class="big"><b class="mono">${cur?cur.km.toFixed(1):'--'}</b><small>Km viaje actual</small></div>
      <div class="big"><b class="mono">${cur?durFmt(cur.ms):'--'}</b><small>Tiempo</small></div>
      <div class="big"><b class="mono">${today.km.toFixed(1)}</b><small>Km hoy</small></div>
      <div class="big"><b class="mono">${curFmt(tripCost(today.km))}</b><small>Nafta hoy</small></div>
      <div class="big"><b class="mono">${Math.round(month.km)}</b><small>Km del mes</small></div>
      <div class="big"><b class="mono">${durFmt(month.ms)}</b><small>Manejando</small></div>
      <div class="big"><b class="mono">${month.n}</b><small>Viajes</small></div>
      <div class="big"><b class="mono">${curFmt(tripCost(month.km))}</b><small>Nafta del mes</small></div>
    </div>`+
    S.trips.slice(-8).reverse().map(x=>`<div class="item"><span>${new Date(x.start).toLocaleString('es-AR', { hourCycle:'h23', weekday:'short', day:'numeric', hour:'2-digit', minute:'2-digit'})}<small>${durFmt(x.end-x.start)} · ${curFmt(tripCost(x.km))} de nafta</small></span><b class="mono">${x.km.toFixed(1)} km</b></div>`).join('')+
    `<div class="hint">Un viaje empieza al moverte y termina tras 5 minutos detenido. El precio de la nafta se cambia en Ajustes.</div>`);
}

/* ================= Asistente de voz con IA (Gemini, ChatGPT o Claude) ================= */
const AI_NAMES = { gemini:'Gemini', openai:'ChatGPT', anthropic:'Claude' };
let aiHist = [], aiBusy = false;
function carContext(){
  const maint = S.maint.map(m=>{ const left=Math.round(m.everyKm-(S.odo-m.lastKm)); return `- ${m.name}: cada ${m.everyKm} km; ${left>0?'faltan '+left+' km':'pendiente'}`; }).join('\n');

  const o = obd.ok ? `Motor (OBD en vivo${obd.sim?', DEMO':''}): ${obd.rpm!=null?Math.round(obd.rpm)+' rpm, ':''}${obd.temp!=null?'agua '+Math.round(obd.temp)+'°C, ':''}${obd.volt!=null?'batería '+obd.volt.toFixed(1)+' V, ':''}check engine ${obd.mil?'ENCENDIDO':'apagado'}.` : 'Motor: sin adaptador OBD conectado.';
  const dtc = S.lastScan ? `Último escaneo de fallas (${new Date(S.lastScan.t).toLocaleDateString('es-AR')}): ${S.lastScan.codes.length?S.lastScan.codes.map(c=>c+' '+dtcDesc(c)).join('; '):'sin códigos'}.` : '';
  const now=new Date(), m0=new Date(now.getFullYear(),now.getMonth(),1).getTime();
  const mk=S.trips.filter(x=>x.start>=m0).reduce((a,x)=>a+x.km,0);
  return `Auto: Toyota Passo 2004, motor 1.3 K3-VE, caja automática de 4 marchas, distribución por cadena.
Odómetro: ${Math.round(S.odo)} km. Velocidad actual: ${Math.round(speedKmh)} km/h.
Service:\n${maint}
Vencimientos:\n${dates}
${o}
${dtc}
Nafta: consumo promedio ${avgCons().toFixed(1)} L/100 km, precio ${S.cur}${S.fuelPrice}/L. Km este mes: ${Math.round(mk)} (${S.cur}${tripCost(mk).toFixed(2)} de nafta).
${wx&&wx.current?'Clima: '+WX(wx.current.weather_code)[1]+', '+Math.round(wx.current.temperature_2m)+'°C.':''}
${S.parking?'Parking guardado: '+new Date(S.parking.t).toLocaleString('es-AR')+'.':''}
Fecha y hora: ${now.toLocaleString('es-AR')}.`;
}
function sysPrompt(){
  return `Sos el asistente de voz del auto de ${(S.greet||'').replace(/^hola,?\s*/i,'')||'el conductor'}. Respondé en español rioplatense, en 1 a 3 oraciones cortas, porque la respuesta se lee en voz alta mientras maneja. Sin listas, sin markdown, sin emojis. Si algo es peligroso para el auto o la persona, decilo primero. Usá estos datos del auto cuando sirvan:\n${carContext()}`;
}
async function callLLM(){
  const prov=S.ai.prov, key=(S.ai.keys[prov]||'').trim(), model=(S.ai.models[prov]||'').trim();
  if(!key) throw new Error('Falta la clave de '+AI_NAMES[prov]+' en Ajustes');
  if(!model) throw new Error('Falta el modelo de '+AI_NAMES[prov]+' en Ajustes');
  const sys=sysPrompt(), msgs=aiHist.slice(-8);
  let r, j;
  if(prov==='gemini'){
    r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{ method:'POST', headers:{ 'Content-Type':'application/json', 'x-goog-api-key':key },
      body:JSON.stringify({ system_instruction:{ parts:[{ text:sys }] }, contents:msgs.map(m=>({ role:m.role==='user'?'user':'model', parts:[{ text:m.text }] })) }) });
    j=await r.json(); if(!r.ok) throw new Error(j.error&&j.error.message||('Error '+r.status));
    return ((j.candidates||[])[0]?.content?.parts||[]).map(p=>p.text||'').join('').trim();
  }
  if(prov==='openai'){
    r=await fetch('https://api.openai.com/v1/chat/completions',{ method:'POST', headers:{ 'Content-Type':'application/json', 'Authorization':'Bearer '+key },
      body:JSON.stringify({ model, messages:[{ role:'system', content:sys }, ...msgs.map(m=>({ role:m.role, content:m.text }))] }) });
    j=await r.json(); if(!r.ok) throw new Error(j.error&&j.error.message||('Error '+r.status));
    return (j.choices&&j.choices[0].message.content||'').trim();
  }
  r=await fetch('https://api.anthropic.com/v1/messages',{ method:'POST', headers:{ 'Content-Type':'application/json', 'x-api-key':key, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body:JSON.stringify({ model, max_tokens:400, system:sys, messages:msgs.map(m=>({ role:m.role, content:m.text })) }) });
  j=await r.json(); if(!r.ok) throw new Error(j.error&&j.error.message||('Error '+r.status));
  return (j.content||[]).map(b=>b.text||'').join('').trim();
}
function renderChat(extra){
  const P=plugin('Voice');
  openModal(`<h2>Asistente <small>${AI_NAMES[S.ai.prov]}</small></h2>
    <div class="chat">${aiHist.map(m=>`<div class="msg ${m.role==='user'?'u':'a'}">${esc(m.text)}</div>`).join('')}${extra?`<div class="msg w">${esc(extra)}</div>`:''}</div>
    ${P?`<button class="bigmic tap" onclick="aiListen()" aria-label="Hablar">${svg('mic')}</button><div class="hint">Tocá y hablá</div>`
       :`<div class="row"><input id="aiIn" class="wide" placeholder="Escribí tu pregunta" onkeydown="if(event.key==='Enter')aiSend(this.value)"><button class="btn go tap" onclick="aiSend($('aiIn').value)">Preguntar</button></div>`}
    ${aiHist.length?'':`<div class="chips">${['¿Cuánto me falta para el cambio de aceite?','¿Qué tengo pendiente del auto?','¿Cuánto gasté de nafta este mes?','¿Va a llover?'].map(q=>`<button class="tap" onclick="aiSend('${q}')">${q}</button>`).join('')}</div>`}`);
  const b=$('modalBody'); b.parentElement.scrollTop=b.parentElement.scrollHeight;
}
function askAI(){
  const prov=S.ai.prov;
  if(!(S.ai.keys[prov]||'').trim()){ openAISettings(); return; }
  renderChat();
  if(plugin('Voice')) aiListen();
}
async function aiListen(){
  const P=plugin('Voice'); if(!P||aiBusy) return;
  try { P.stop(); const r=await P.listen({ lang:S.ai.lang||'es-AR', prompt:'Preguntale a '+AI_NAMES[S.ai.prov] }); if(r.text) aiSend(r.text); }
  catch(e){ toast(e.message||'No pude escuchar','err'); }
}
async function aiSend(text){
  text=(text||'').trim(); if(!text||aiBusy) return;
  aiBusy=true; aiHist.push({ role:'user', text }); renderChat('Pensando…');
  try {
    const ans = await callLLM() || 'No obtuve respuesta.';
    aiHist.push({ role:'assistant', text:ans }); renderChat();
    const V=plugin('Voice'); if(V && S.ai.voice) V.speak({ text:ans, lang:S.ai.lang||'es-AR' }).catch(()=>{});
  } catch(e) {
    aiHist.pop(); renderChat('No pude responder: '+(e.message||e));
  }
  aiBusy=false;
}
function openAISettings(){
  const pv=S.ai.prov;
  const help = { gemini:'Clave gratis en aistudio.google.com/apikey (Google AI Studio).', openai:'Clave en platform.openai.com (cobra por uso).', anthropic:'Clave en console.anthropic.com (cobra por uso).' }[pv];
  openModal(`<h2>Asistente con IA</h2>
    <div class="item"><span>Proveedor<small>${help}</small></span><span class="seg">${Object.keys(AI_NAMES).map(k=>`<button class="tap ${pv===k?'on':''}" onclick="S.ai.prov='${k}';save();openAISettings()">${AI_NAMES[k]}</button>`).join('')}</span></div>
    <div class="item"><span>Clave de API<small>${S.ai.keys[pv]?'Guardada solo en esta tablet':'Pegala acá'}</small></span><input id="aiKey" class="wide" type="password" value="${esc(S.ai.keys[pv]||'')}" onchange="S.ai.keys['${pv}']=this.value.trim();save()"></div>
    <div class="item"><span>Modelo<small>Cambialo si el proveedor lo actualiza</small></span><input class="wide" value="${esc(S.ai.models[pv]||'')}" placeholder="nombre del modelo" onchange="S.ai.models['${pv}']=this.value.trim();save()"></div>

    <div class="row" style="margin-top:1vh"><button class="btn go tap" onclick="S.ai.keys['${pv}']=$('aiKey').value.trim();save();askAI()">Probar el asistente</button></div>`);
}

    `<div class="item"><span>Modo noche<small>Automático: se oscurece con la puesta del sol</small></span><span class="seg">${[['auto','Auto'],['on','Siempre'],['off','Apagado']].map(([k,l])=>`<button class="tap ${S.night===k?'on':''}" onclick="S.night='${k}';save();applyNight();openSettings()">${l}</button>`).join('')}</span></div>`+
    `<div class="item"><span>Saludo<small>${esc(S.greet||'(oculto)')}</small></span><button class="btn tap" onclick="editGreet()">Cambiar</button></div>`+
    `<div class="item"><span>Tema de colores<small>${(THEMES[S.theme]||THEMES.aurora).n}</small></span><span class="swatches">${Object.keys(THEMES).map(k=>`<button class="sw tap ${S.theme===k?'on':''}" style="--s:linear-gradient(135deg, ${THEMES[k].acc}, ${THEMES[k].acc2})" onclick="setLook('theme','${k}')" aria-label="${THEMES[k].n}"></button>`).join('')}</span></div>`+
    `<div class="item"><span>Brillo de fondo en movimiento<small>Si la tablet anda lenta, apagalo</small></span><button class="btn ${S.anim?'go':''} tap" onclick="S.anim=!S.anim;save();applyLook();openSettings()">${S.anim?'Sí':'No'}</button></div>`+
    `<div class="item"><span>Lado del volante<small>${S.side==='lhd'?'Izquierda: apps a la izquierda':'Derecha (Passo japonés): apps cerca tuyo'}</small></span><button class="btn tap" onclick="setLook('side','${S.side==='lhd'?'rhd':'lhd'}')">Invertir</button></div>`+
    `<div class="item"><span>Íconos de apps<small>${S.mono?'Monocromo':'Color original'}</small></span><button class="btn tap" onclick="S.mono=!S.mono;save();renderApps();openSettings()">${S.mono?'Pasar a color':'Pasar a monocromo'}</button></div>`+
    `<h2 style="margin-top:1.8vh">Apps de la derecha</h2>`+ S.apps.map(appRow('apps')).join('')+
    `<h2 style="margin-top:1.8vh">Dock de abajo</h2>`+ S.dock.map(appRow('dock')).join('')+
    `<h2 style="margin-top:1.8vh">Más apps</h2>`+ S.drawer.map(appRow('drawer')).join('')+
    `<div class="item"><span>Adaptador OBD guardado<small>${S.obdAddr||'ninguno'}</small></span>${S.obdAddr?`<button class="btn go tap" onclick="connectObd(S.obdAddr)">Reconectar</button>`:''}</div>`);
}
function editApp(k,i){
  const a=S[k][i];
  const n=prompt('Nombre del botón', a.n); if(n===null) return;
  const p=prompt('Paquete Android (ej. com.spotify.music)', a.pkg); if(p===null) return;
  a.n=n.trim()||a.n; a.pkg=p.trim()||a.pkg; save(); renderApps(); openSettings(); loadIcons();
}

/* ================= Arranque ================= */
applyLook(); artColor(""); renderCar(); renderApps(); renderNp(); initMap(); loadIcons(); renderShift(); renderObd(); showSpeed(); applyNight(); pollMedia(); renderTripStat(); loadWeather();
if (S.autoCarplay && plugin('AppIcons')) { const m=S.dock.find(a=>a.main&&a.pkg); if(m) setTimeout(()=>openApp(m.pkg), 4000); }
document.addEventListener('deviceready',()=>{ BT = window.bluetoothSerial; loadIcons(); if(S.obdAddr && BT) connectObd(S.obdAddr); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ loadIcons(); pollMedia(); applyNight(); } });
</script>
</body>
</html>
