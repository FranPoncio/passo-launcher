<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Passo Launcher</title>
<style>
  :root { --bg:#000; --card:#0d0d10; --txt:#fff; --mut:#71717a; --ok:#10b981; --cold:#38bdf8; --bad:#ef4444; --amb:#fbbf24; }
  * { box-sizing:border-box; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body { height:100%; background:var(--bg); color:var(--txt); font-family:system-ui,-apple-system,Roboto,sans-serif; overflow:hidden; font-variant-numeric:tabular-nums; }
  body { display:grid; grid-template-rows:56px 1fr 72px; padding:8px 14px; gap:6px; transition:background .4s; }
  button { font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  button:active { transform:scale(.94); }

  header { display:flex; align-items:center; justify-content:space-between; }
  .greet { font-weight:800; letter-spacing:.2em; font-size:13px; color:#e4e4e7; text-transform:uppercase; margin-right:12px; }
  .brand { font-weight:800; letter-spacing:.2em; font-size:13px; color:#a1a1aa; text-transform:uppercase; }
  #toast { position:fixed; top:14px; left:50%; transform:translate(-50%,-8px); background:rgba(39,39,42,.92); padding:10px 20px; border-radius:99px; font-size:13px; font-weight:800; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:60; display:flex; align-items:center; gap:10px; white-space:nowrap; }
  #toast.on { opacity:1; transform:translate(-50%,0); }
  #toast i { width:9px; height:9px; border-radius:50%; background:var(--ok); display:inline-block; }
  #toast.warn i { background:var(--amb); } #toast.err i { background:var(--bad); }
  main.lhd { grid-template-columns:1fr 1.2fr 1.1fr; }
  main.lhd > section:nth-child(1) { order:3; } main.lhd > section:nth-child(2) { order:2; } main.lhd > section:nth-child(3) { order:1; }
  .swatches { display:flex; gap:10px; }
  .sw { width:46px; height:46px; border-radius:14px; background:var(--s); box-shadow:inset 0 0 0 1px #3f3f46; }
  .sw.on { box-shadow:inset 0 0 0 3px var(--ok); }
  .dtc { display:flex; gap:14px; align-items:center; padding:14px 16px; background:var(--card); border-radius:16px; margin-bottom:8px; }
  .dtc b { font-size:20px; font-weight:900; color:var(--amb); min-width:78px; }
  .dtc span { font-weight:600; color:#d4d4d8; }
  .brand b { color:var(--bad); }
  .pill { font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; padding:5px 12px; border-radius:99px; background:#052e22; color:var(--ok); margin-left:12px; }
  .pill.cold { background:#082f49; color:var(--cold); }
  .pill.bad  { background:var(--bad); color:#fff; }
  .pill.sim  { background:#3b2f05; color:var(--amb); }
  #clock { font-size:34px; font-weight:900; }

  main { display:grid; grid-template-columns:1.1fr 1.2fr 1fr; gap:14px; min-height:0; }
  .col { display:flex; flex-direction:column; justify-content:center; align-items:center; min-height:0; }

  /* Izquierda */
  .gauge { position:relative; width:min(100%,300px); aspect-ratio:1/.85; }
  .gauge svg { width:100%; height:100%; }
  .gauge .c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:12%; }
  #speed { font-size:clamp(56px,9vw,96px); font-weight:900; line-height:1; letter-spacing:-.04em; }
  .unit { font-size:11px; letter-spacing:.2em; color:var(--mut); font-weight:700; text-transform:uppercase; margin-top:4px; }
  #rpm { font-size:14px; font-weight:800; color:var(--ok); margin-top:6px; }
  .tiles { display:flex; gap:22px; margin-top:6px; }
  .tile { text-align:center; }
  .tile small { display:block; font-size:10px; letter-spacing:.15em; color:var(--mut); font-weight:700; text-transform:uppercase; }
  .tile span { font-size:26px; font-weight:900; white-space:nowrap; }

  /* Centro */
  .panel { width:100%; background:var(--card); border-radius:22px; padding:16px 18px; }
  .panel h3 { font-size:11px; letter-spacing:.2em; color:var(--mut); text-transform:uppercase; margin-bottom:10px; }
  .shift-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center; margin-bottom:12px; }
  .shift-grid div b { display:block; font-size:24px; font-weight:900; }
  .shift-grid div small { font-size:10px; color:var(--mut); letter-spacing:.1em; text-transform:uppercase; }
  .row { display:flex; gap:10px; }
  .btn { flex:1; padding:14px 8px; border-radius:16px; background:#18181b; font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.06em; }
  .btn.go { background:#064e3b; color:#6ee7b7; }
  .btn.stop { background:#7f1d1d; color:#fecaca; }
  .btn.amb { background:#3b2f05; color:var(--amb); }
  .alerts { width:100%; margin-top:10px; font-size:13px; font-weight:700; color:var(--amb); text-align:center; min-height:20px; }

  /* Derecha */
  .apps { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; width:100%; }
  .app { background:var(--card); border-radius:20px; padding:14px 6px 12px; display:flex; flex-direction:column; align-items:center; gap:8px; font-size:13px; font-weight:800; color:#d4d4d8; }
  .app .ico { width:52px; height:52px; display:flex; align-items:center; justify-content:center; }
  .app img { width:52px; height:52px; border-radius:14px; object-fit:cover; transition:filter .3s; }
  .app .fb { width:52px; height:52px; border-radius:16px; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--c) 16%, #000); color:var(--c); }
  .app .fb svg { width:28px; height:28px; }
  body.mono .app img { filter:grayscale(1) brightness(1.15) contrast(.95); }
  body.mono .app .fb { background:#1c1c20; color:#e4e4e7; }
  svg.i { fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

  footer { display:flex; align-items:center; justify-content:space-around; background:var(--card); border-radius:24px; padding:0 10px; }
  footer button { display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; font-weight:700; color:#a1a1aa; padding:6px 14px; }
  footer button svg { width:24px; height:24px; color:#d4d4d8; }
  footer button:active svg { color:#fff; }

  /* Modal */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.96); display:none; flex-direction:column; padding:22px 40px; z-index:30; overflow:auto; }
  #modal.on { display:flex; }
  #modal h2 { font-size:22px; font-weight:900; margin-bottom:14px; }
  #modal .x { position:absolute; right:26px; top:16px; font-size:30px; color:#a1a1aa; }
  .item { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--card); border-radius:16px; margin-bottom:8px; font-weight:700; gap:10px; }
  .item small { color:var(--mut); font-weight:600; display:block; margin-top:2px; }
  .item .btn { flex:none; padding:10px 16px; }
  input { background:#18181b; color:#fff; border:none; border-radius:12px; padding:12px 14px; font:inherit; width:170px; }

  #night { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .4s; z-index:40; }
  #danger { position:fixed; inset:0; pointer-events:none; z-index:20; display:none; background:radial-gradient(circle,transparent 55%,rgba(239,68,68,.5) 100%); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:0} 50%{opacity:1} }
</style>
</head>
<body>
<div id="night"></div><div id="danger"></div><div id="toast"><i></i><span id="toastTxt"></span></div>

<header>
  <div style="display:flex;align-items:center">
    <span class="greet" id="greet"></span>
    <span class="brand">Passo <b>1.3</b></span>
    <span id="badge" class="pill sim">Sin OBD</span>
  </div>
  <div id="clock">--:--</div>
</header>

<main>
  <!-- IZQUIERDA: datos del motor -->
  <section class="col">
    <div class="gauge" onclick="openObd()">
      <svg viewBox="0 0 200 150">
        <path d="M 25 130 A 80 80 0 1 1 175 130" fill="none" stroke="#18181b" stroke-width="10" stroke-linecap="round"/>
        <path id="arc" d="M 25 130 A 80 80 0 1 1 175 130" fill="none" stroke="#10b981" stroke-width="10" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330" style="transition:stroke-dashoffset .3s,stroke .3s"/>
      </svg>
      <div class="c">
        <div id="speed">0</div>
        <div class="unit">km/h GPS</div>
        <div id="rpm">-- RPM</div>
      </div>
    </div>
    <div class="tiles">
      <div class="tile"><small>Agua</small><span id="temp">--</span></div>
      <div class="tile"><small>Batería</small><span id="volt">--</span></div>
      <div class="tile"><small>L/100</small><span id="cons">--</span></div>
    </div>
  </section>

  <!-- CENTRO: turno + alertas -->
  <section class="col">
    <div class="panel">
      <h3>Turno · Delivery</h3>
      <div class="shift-grid">
        <div><b id="shTime">0:00</b><small>Tiempo</small></div>
        <div><b id="shKm">0.0</b><small>Km</small></div>
        <div><b id="shMoney">$0</b><small>Ganado</small></div>
        <div><b id="shHr">$0</b><small>Por hora</small></div>
        <div><b id="shKmM">$0.00</b><small>Por km</small></div>
        <div><b id="shTrips">0</b><small>Pedidos</small></div>
      </div>
      <div class="row">
        <button class="btn go" id="shBtn" onclick="toggleShift()">Iniciar turno</button>
        <button class="btn amb" onclick="addTrip()">+ Pedido</button>
      </div>
    </div>
    <div class="alerts" id="alerts"></div>
  </section>

  <!-- DERECHA: accesos -->
  <section class="col">
    <div class="apps" id="apps"></div>
  </section>
</main>

<footer>
  <button onclick="saveParking()" data-ic="pin"><span id="parkLbl">Parking</span></button>
  <button onclick="openMaint()" data-ic="wrench">Service</button>
  <button onclick="openFuel()" data-ic="fuel">Nafta</button>
  <button onclick="openObd()" data-ic="obd">OBD</button>
  <button onclick="openSettings()" data-ic="sliders">Ajustes</button>
  <button onclick="openAndroid('settings')" data-ic="grid">Sistema</button>
  <button onclick="toggleNight()" data-ic="moon">Noche</button>
</footer>

<div id="modal"><button class="x" onclick="closeModal()">✕</button><div id="modalBody"></div></div>

<script>
/* ================= Estado persistente ================= */
const DEF = {
  odo: 0, // km totales acumulados por GPS (ajustable a mano)
  maint: [
    { name:'Aceite motor',  everyKm:5000,  lastKm:0 },
    { name:'Filtro de aire',everyKm:15000, lastKm:0 },
    { name:'Bujías',        everyKm:40000, lastKm:0 },
    { name:'Frenos (revisar)', everyKm:10000, lastKm:0 }
  ],
  dates: [ { name:'WOF', due:'' }, { name:'Rego', due:'' } ],
  fuel: [],
  parking: null,
  shift: null,       // {start, km0, money, trips}
  obdAddr: '',
  mono: false,       // íconos de apps en blanco y negro
  greet: 'Hola, Fran',
  bg: '#000000',
  side: 'rhd',       // rhd = volante a la derecha (apps a la derecha, cerca del conductor)
  apps: [
    { n:'Maps',    ic:'map',   c:'#34d399', pkg:'com.google.android.apps.maps' },
    { n:'Waze',    ic:'nav',   c:'#38bdf8', pkg:'com.waze' },
    { n:'Uber',    ic:'car',   c:'#e4e4e7', pkg:'com.ubercab.driver' },
    { n:'DiDi',    ic:'bag',   c:'#fb923c', pkg:'com.didiglobal.driver' },
    { n:'Spotify', ic:'music', c:'#4ade80', pkg:'com.spotify.music' },
    { n:'YT Music',ic:'play',  c:'#f87171', pkg:'com.google.android.apps.youtube.music' }
  ]
};

/* ================= Íconos de línea propios ================= */
const ICONS = {
  map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  nav:'<path d="M12 3 5 20l7-4 7 4z"/>',
  car:'<path d="M3 16v-3.5L5 8a2 2 0 0 1 1.8-1h10.4A2 2 0 0 1 19 8l2 4.5V16a1 1 0 0 1-1 1h-1"/><path d="M5 17H4a1 1 0 0 1-1-1M9 17h6M3 12.5h18"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
  bag:'<path d="M4.5 8h15l-1.3 11.2a2 2 0 0 1-2 1.8H7.8a2 2 0 0 1-2-1.8z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/>',
  music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  play:'<circle cx="12" cy="12" r="9"/><path d="m10 8.5 5.5 3.5-5.5 3.5z"/>',
  app:'<rect x="4" y="4" width="16" height="16" rx="4"/>',
  pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.5 17.3a1.8 1.8 0 0 0 2.5 2.5l5.8-5.8a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.3-.5-.5-2.3z"/>',
  fuel:'<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10"/><path d="M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V9l-3-3"/>',
  obd:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',
  sliders:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'
};
const svg = k => `<svg class="i" viewBox="0 0 24 24">${ICONS[k]||ICONS.app}</svg>`;
let S;
try { S = Object.assign({}, DEF, JSON.parse(localStorage.getItem('passo')||'{}')); } catch(e){ S = {...DEF}; }
const save = () => { try{ localStorage.setItem('passo', JSON.stringify(S)); }catch(e){} };
const $ = id => document.getElementById(id);

/* ================= Reloj ================= */
setInterval(()=>{ const d=new Date(); $('clock').textContent=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); },1000);

/* ================= Lanzar apps (nativo vía Capacitor) ================= */
function openApp(pkg){
  const AL = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AppLauncher;
  if (AL) AL.openUrl({ url: pkg }).catch(()=>toast('No se pudo abrir '+pkg));
  else toast('Solo funciona dentro de la app (APK)');
}
function openAndroid(){ const AL=window.Capacitor?.Plugins?.AppLauncher; if(AL) AL.openUrl({url:'com.android.settings'}); else toast('Solo en la APK'); }
// Migrar accesos guardados por versiones viejas (que usaban emoji)
S.apps = S.apps.map((a,i)=>{ const d=DEF.apps.find(x=>x.pkg===a.pkg)||DEF.apps[i]||{}; return { n:a.n, pkg:a.pkg, ic:a.ic||d.ic||'app', c:a.c||d.c||'#d4d4d8' }; });

// Íconos reales de las apps instaladas (los entrega Android vía el plugin AppIcons)
let realIcons = {};
try { realIcons = JSON.parse(localStorage.getItem('passoIcons')||'{}'); } catch(e){}
function iconPlugin(){
  const C = window.Capacitor;
  if (!C || !C.isNativePlatform || !C.isNativePlatform()) return null;
  return (C.Plugins && C.Plugins.AppIcons) || (C.registerPlugin ? C.registerPlugin('AppIcons') : null);
}
async function loadIcons(){
  const P = iconPlugin(); if (!P) return;
  try {
    const r = await P.get({ packages: S.apps.map(a=>a.pkg) });
    realIcons = r.icons || {};
    try { localStorage.setItem('passoIcons', JSON.stringify(realIcons)); } catch(e){}
    renderApps();
  } catch(e) {}
}
function renderApps(){
  document.body.classList.toggle('mono', !!S.mono);
  $('apps').innerHTML = S.apps.map(a=>{
    const real = realIcons[a.pkg];
    const ico = real ? `<img src="${real}" alt="">` : `<span class="fb" style="--c:${a.c}">${svg(a.ic)}</span>`;
    return `<button class="app" onclick="openApp('${a.pkg}')"><span class="ico">${ico}</span>${a.n}</button>`;
  }).join('');
}
document.querySelectorAll('footer button[data-ic]').forEach(b=>b.insertAdjacentHTML('afterbegin', svg(b.dataset.ic)));
renderApps(); loadIcons();

/* ================= Aviso flotante ================= */
let tt; function toast(m, kind){
  const t=$('toast'); $('toastTxt').textContent=m; t.className='on'+(kind?' '+kind:'');
  clearTimeout(tt); tt=setTimeout(()=>t.className='',2800);
}

/* ================= Apariencia: saludo, fondo, lado del volante ================= */
const BGS = [ ['#000000','Negro'], ['#070b14','Azul noche'], ['#0f1318','Grafito'], ['#140709','Rojo'], ['#05120e','Esmeralda'] ];
function applyLook(){
  $('greet').textContent = S.greet || '';
  $('greet').style.display = S.greet ? '' : 'none';
  document.documentElement.style.setProperty('--bg', S.bg||'#000');
  document.querySelector('main').classList.toggle('lhd', S.side==='lhd');
}
applyLook();

/* ================= GPS real: velocidad + km ================= */
let gpsLast=null, speedKmh=0;
function hav(a,b,c,d){ const R=6371,r=x=>x*Math.PI/180; const dl=r(c-a),dn=r(d-b); const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
if (navigator.geolocation) {
  navigator.geolocation.watchPosition(p=>{
    const c=p.coords;
    speedKmh = c.speed!=null && !isNaN(c.speed) ? Math.max(0,c.speed*3.6) : speedKmh;
    if (c.accuracy<=30) {
      if (gpsLast) { const d=hav(gpsLast.lat,gpsLast.lon,c.latitude,c.longitude); if (d>0.005 && d<1) { S.odo+=d; } }
      gpsLast={lat:c.latitude,lon:c.longitude};
    }
    $('speed').textContent=Math.round(speedKmh<3?0:speedKmh);
  }, ()=>{}, { enableHighAccuracy:true, maximumAge:1000, timeout:10000 });
}
setInterval(save,15000);

/* ================= OBD2 (ELM327 Bluetooth clásico) ================= */
const obd = { rpm:null, temp:null, volt:null, maf:null, iat:null, mil:null, dtcCount:null, proto:'', ok:false, sim:false };
let BT = window.bluetoothSerial; // plugin cordova-plugin-bluetooth-serial (se completa en deviceready)
let buf='', waiter=null, pollTimer=null, pollN=0;

// Todos los comandos pasan por esta cola: el ELM327 contesta de a uno
let cmdQueue = Promise.resolve();
function cmd(c, ms){ const p = cmdQueue.then(()=>btWrite(c, ms)); cmdQueue = p.catch(()=>{}); return p; }

function btWrite(cmd, ms){
  return new Promise(res=>{
    waiter = res; buf='';
    BT.write(cmd+'\r', ()=>{}, ()=>{ waiter=null; res(''); });
    setTimeout(()=>{ if(waiter===res){ waiter=null; res(buf); } }, ms||1500);
  });
}
function parseHex(resp, pid){
  const s = resp.replace(/[\s>]/g,'').toUpperCase();
  const k = '41'+pid; const i = s.indexOf(k);
  if (i<0) return null;
  const h = s.slice(i+k.length); const out=[];
  for (let j=0;j+1<h.length;j+=2) out.push(parseInt(h.substr(j,2),16));
  return out;
}
async function obdInit(){
  await cmd('ATZ', 4000);
  for (const c of ['ATE0','ATL0','ATS0','ATH0','ATSP0']) await cmd(c);
  await cmd('0100', 10000); // fuerza la detección de protocolo (puede tardar)
  obd.proto = (await cmd('ATDPN')).replace(/[\s>]/g,'').toUpperCase();
}
async function obdPoll(){
  let r;
  r = parseHex(await cmd('010C'),'0C'); if(r&&r.length>=2) obd.rpm = ((r[0]*256)+r[1])/4;
  r = parseHex(await cmd('0105'),'05'); if(r&&r.length>=1) obd.temp = r[0]-40;
  r = parseHex(await cmd('0142'),'42'); if(r&&r.length>=2) obd.volt = ((r[0]*256)+r[1])/1000;
  r = parseHex(await cmd('0110'),'10'); obd.maf = (r&&r.length>=2) ? ((r[0]*256)+r[1])/100 : null;
  // Cada ~5 vueltas: temperatura de admisión. Cada ~25: luz de check engine y cantidad de fallas.
  if (pollN % 5 === 0) { r = parseHex(await cmd('010F'),'0F'); obd.iat = (r&&r.length>=1) ? r[0]-40 : null; }
  if (pollN % 25 === 0) { r = parseHex(await cmd('0101'),'01'); if(r&&r.length>=1){ obd.mil = !!(r[0]&0x80); obd.dtcCount = r[0]&0x7F; } }
  pollN++;
  obd.ok = true; renderObd();
}

/* ---------- Códigos de falla (DTC) reales: modo 03 leer, modo 04 borrar ---------- */
const DTC_INFO = {
  P0100:'Sensor MAF (caudal de aire): falla de circuito', P0101:'Sensor MAF: lectura fuera de rango', P0102:'Sensor MAF: señal baja', P0103:'Sensor MAF: señal alta',
  P0110:'Sensor de temperatura de admisión: falla de circuito', P0115:'Sensor de temperatura del refrigerante: falla de circuito', P0116:'Sensor de temperatura del refrigerante: lectura fuera de rango',
  P0120:'Sensor de posición del acelerador (TPS): falla de circuito', P0125:'El motor tarda en llegar a temperatura (revisar termostato)', P0128:'Termostato: temperatura del refrigerante por debajo de lo normal',
  P0130:'Sonda lambda (antes del catalizador): falla de circuito', P0133:'Sonda lambda (antes del catalizador): respuesta lenta', P0135:'Sonda lambda (antes del catalizador): falla del calefactor',
  P0136:'Sonda lambda (después del catalizador): falla de circuito', P0141:'Sonda lambda (después del catalizador): falla del calefactor',
  P0171:'Mezcla demasiado pobre (posible entrada de aire o MAF sucio)', P0172:'Mezcla demasiado rica',
  P0300:'Fallo de encendido aleatorio', P0301:'Fallo de encendido en cilindro 1', P0302:'Fallo de encendido en cilindro 2', P0303:'Fallo de encendido en cilindro 3', P0304:'Fallo de encendido en cilindro 4',
  P0325:'Sensor de detonación: falla de circuito', P0335:'Sensor de posición del cigüeñal: falla de circuito', P0340:'Sensor de posición del árbol de levas: falla de circuito',
  P0420:'Eficiencia del catalizador por debajo del mínimo', P0440:'Sistema de evaporación (EVAP): falla', P0441:'EVAP: flujo de purga incorrecto', P0442:'EVAP: pérdida chica (revisar tapa de nafta)',
  P0446:'EVAP: falla en el control de ventilación', P0455:'EVAP: pérdida grande (revisar tapa de nafta)', P0500:'Sensor de velocidad del vehículo: falla',
  P0505:'Sistema de control de ralentí: falla', P0560:'Voltaje del sistema: falla', P0700:'La caja automática reporta una falla (leer su propio código)'
};
function dtcDesc(c){
  if (DTC_INFO[c]) return DTC_INFO[c];
  if (/^P1/.test(c)) return 'Código propio de Toyota/Daihatsu: buscalo junto con "Passo"';
  return 'Buscalo en internet con el código exacto';
}
function decodeDtc(a,b){
  if (a===0 && b===0) return null;
  return 'PCBU'[a>>6] + ((a>>4)&3) + (a&15).toString(16).toUpperCase() + b.toString(16).toUpperCase().padStart(2,'0');
}
function parseDtcResponse(resp){
  if (/NO ?DATA/i.test(resp)) return [];
  const isCan = /^A?[6-9AB]$/.test(obd.proto);
  const lines = resp.toUpperCase().split(/[\r\n]+/)
    .map(l=>l.replace(/^\s*[0-9A-F]:/,'').replace(/[\s>]/g,''))
    .filter(l=>/^[0-9A-F]+$/.test(l) && l.length>3);
  const bytes = [];
  if (isCan) {
    const all = lines.join(''); const i = all.indexOf('43'); if (i<0) return null;
    const h = all.slice(i+4); // saltea "43" y el byte de cantidad
    for (let j=0;j+1<h.length;j+=2) bytes.push(parseInt(h.substr(j,2),16));
  } else {
    let found=false;
    lines.forEach(l=>{ if(!l.startsWith('43')) return; found=true; const h=l.slice(2,14); for(let j=0;j+1<h.length;j+=2) bytes.push(parseInt(h.substr(j,2),16)); });
    if (!found) return null;
  }
  const codes=[];
  for (let j=0;j+1<bytes.length;j+=2){ const c=decodeDtc(bytes[j],bytes[j+1]); if(c && !codes.includes(c)) codes.push(c); }
  return codes;
}
async function scanDtc(){
  if (obd.sim) { toast('Modo demo: no hay auto conectado para escanear','warn'); return; }
  if (!BT || !obd.ok) { toast('Conectá el OBD primero','warn'); return; }
  $('dtcBox').innerHTML = '<div class="item">Leyendo la ECU…</div>';
  const resp = await cmd('03', 8000);
  const codes = parseDtcResponse(resp);
  if (codes === null) {
    $('dtcBox').innerHTML = `<div class="item"><span>La ECU no respondió al pedido de códigos<small>Respuesta: ${resp.replace(/[\r\n>]+/g,' ').trim().slice(0,60)||'(vacía)'}. Probá con el motor en contacto.</small></span></div>`;
    return;
  }
  S.lastScan = { t:Date.now(), codes }; save();
  renderDtc();
}
function renderDtc(){
  const s=S.lastScan; if(!s){ $('dtcBox').innerHTML=''; return; }
  const when = new Date(s.t).toLocaleString();
  $('dtcBox').innerHTML = s.codes.length
    ? s.codes.map(c=>`<div class="dtc"><b>${c}</b><span>${dtcDesc(c)}</span></div>`).join('') +
      `<div class="item"><span>Borrar códigos<small>Apaga el check engine, pero no arregla la causa: si la falla sigue, el código vuelve.</small></span><button class="btn stop" onclick="clearDtc()">Borrar</button></div>` +
      `<small style="color:var(--mut)">Escaneo: ${when}</small>`
    : `<div class="item"><span>Sin códigos de falla guardados<small>Escaneo: ${when}</small></span></div>`;
}
async function clearDtc(){
  if (!confirm('¿Borrar los códigos de falla? Hacelo con el motor en contacto (sin arrancar). El check engine se apaga, pero si el problema sigue, vuelve a aparecer.')) return;
  const r = await cmd('04', 8000);
  if (/44/.test(r.replace(/\s/g,''))) { toast('Códigos borrados'); S.lastScan={t:Date.now(),codes:[]}; save(); renderDtc(); }
  else toast('La ECU no aceptó el borrado','err');
}
function connectObd(addr){
  if(!BT){ toast('OBD real solo en la APK. Usá modo demo.'); return; }
  BT.connect(addr, async ()=>{
    S.obdAddr=addr; save();
    BT.subscribe('>', d=>{ buf+=d; if(waiter){ const w=waiter; waiter=null; w(buf);} });
    await obdInit(); obd.sim=false; clearInterval(pollTimer);
    const loop=async()=>{ try{ await obdPoll(); }catch(e){} pollTimer=setTimeout(loop,400); }; loop();
    toast('OBD conectado'); closeModal();
  }, ()=>{ toast('No pude conectar al OBD'); obd.ok=false; renderObd(); });
}
// Modo demo para probar la pantalla sin auto
function startSim(){
  obd.sim=true; clearInterval(pollTimer);
  let t=0; pollTimer=setInterval(()=>{ t+=0.1;
    obd.rpm=1200+Math.abs(Math.sin(t))*2200; obd.temp=Math.min(104,60+t*2); obd.volt=14.1-Math.random()*.1; obd.maf=3+Math.abs(Math.sin(t))*8; obd.ok=true;
    if(!navigator.geolocation||!gpsLast){ speedKmh=Math.abs(Math.sin(t))*80; $('speed').textContent=Math.round(speedKmh); }
    renderObd();
  },400); closeModal();
}
function renderObd(){
  const rpm=obd.rpm, t=obd.temp, v=obd.volt;
  $('rpm').textContent = rpm!=null ? Math.round(rpm)+' RPM' : '-- RPM';
  $('temp').textContent = t!=null ? Math.round(t)+'°' : '--';
  $('volt').innerHTML = v!=null ? v.toFixed(1)+'<small style="display:inline;font-size:13px;color:#71717a;letter-spacing:0">V</small>' : '--';
  // Consumo instantáneo estimado con MAF (si el auto lo reporta): L/h = MAF/(14.7*740)*3600
  let c='--';
  if (obd.maf!=null && speedKmh>8) { const lph=obd.maf/(14.7*740)*3600; c=(lph/speedKmh*100).toFixed(1); }
  $('cons').textContent=c;
  const arc=$('arc'); const frac=Math.min(1,(rpm||0)/6500);
  arc.style.strokeDashoffset = 330-330*frac;
  const hot=t!=null&&t>=100, lowV=v!=null&&v<12.0 , cold=t!=null&&t<60;
  arc.setAttribute('stroke', hot?'#ef4444': cold?'#38bdf8':'#10b981');
  $('danger').style.display = hot?'block':'none';
  const b=$('badge');
  b.className='pill'+(hot?' bad':cold?' cold':'');
  b.textContent = obd.sim?'Demo': !obd.ok?'Sin OBD': hot?'⚠ Temp '+Math.round(t)+'°': obd.mil?'⚠ Check engine'+(obd.dtcCount?' ('+obd.dtcCount+')':''): cold?'Motor frío':'● Motor óptimo';
  if(!obd.ok && !obd.sim) b.classList.add('sim');
  if(obd.mil && !hot && !obd.sim) b.className='pill bad';
  refreshAlerts(hot,lowV);
}

/* ================= Alertas (service, WOF/rego, batería) ================= */
function refreshAlerts(hot,lowV){
  const a=[];
  if(hot) a.push('⚠ Motor recalentado: parate');
  if(lowV) a.push('⚠ Batería baja (<12 V)');
  S.maint.forEach(m=>{ const left=m.everyKm-(S.odo-m.lastKm); if(left<=0) a.push(m.name+' vencido'); else if(left<500) a.push(m.name+' en '+Math.round(left)+' km'); });
  S.dates.forEach(d=>{ if(!d.due) return; const days=Math.ceil((new Date(d.due)-new Date())/864e5); if(days<0) a.push(d.name+' VENCIDO'); else if(days<=30) a.push(d.name+' en '+days+' días'); });
  $('alerts').textContent = a.slice(0,2).join('   ·   ');
}

/* ================= Turno delivery ================= */
function toggleShift(){
  if(!S.shift){ S.shift={start:Date.now(),km0:S.odo,money:0,trips:0}; }
  else if(confirm('¿Terminar turno?')){ const s=S.shift; showShiftSummary(s); S.shift=null; }
  save(); renderShift();
}
function addTrip(){
  if(!S.shift){ toast('Iniciá el turno primero'); return; }
  const v=parseFloat(prompt('Ganancia del pedido ($)'));
  if(!isNaN(v)&&v>0){ S.shift.money+=v; S.shift.trips++; save(); renderShift(); }
}
function showShiftSummary(s){
  const h=(Date.now()-s.start)/36e5, km=S.odo-s.km0;
  openModal(`<h2>Resumen del turno</h2>
    <div class="item">Tiempo<b>${h.toFixed(1)} h</b></div>
    <div class="item">Km<b>${km.toFixed(1)}</b></div>
    <div class="item">Ganado<b>$${s.money.toFixed(2)}</b></div>
    <div class="item">Por hora<b>$${(s.money/Math.max(h,.01)).toFixed(2)}</b></div>
    <div class="item">Por km<b>$${(s.money/Math.max(km,.1)).toFixed(2)}</b></div>`);
}
function renderShift(){
  const s=S.shift;
  $('shBtn').textContent = s?'Terminar turno':'Iniciar turno';
  $('shBtn').className = 'btn '+(s?'stop':'go');
  if(!s){ ['shTime','shKm','shMoney','shHr','shKmM','shTrips'].forEach(i=>$(i).textContent=i=='shTime'?'0:00':i=='shKm'?'0.0':i=='shTrips'?'0':'$0'); return; }
  const ms=Date.now()-s.start, h=ms/36e5, km=S.odo-s.km0;
  $('shTime').textContent=Math.floor(h)+':'+String(Math.floor((ms/6e4)%60)).padStart(2,'0');
  $('shKm').textContent=km.toFixed(1);
  $('shMoney').textContent='$'+s.money.toFixed(0);
  $('shHr').textContent='$'+(s.money/Math.max(h,.05)).toFixed(0);
  $('shKmM').textContent='$'+(s.money/Math.max(km,.1)).toFixed(2);
  $('shTrips').textContent=s.trips;
}
setInterval(renderShift,5000); renderShift();

/* ================= Parking ================= */
function saveParking(){
  if(!gpsLast){ toast('Sin señal GPS todavía'); return; }
  S.parking={lat:gpsLast.lat,lon:gpsLast.lon,t:Date.now()}; save(); $('parkLbl').textContent='Guardado ✓'; setTimeout(()=>$('parkLbl').textContent='Parking',2500);
  toast('Parking guardado');
}

/* ================= Modales ================= */
function openModal(h){ $('modalBody').innerHTML=h; $('modal').classList.add('on'); }
function closeModal(){ $('modal').classList.remove('on'); refreshAlerts(); }

function openMaint(){
  openModal(`<h2>Service · odómetro ${Math.round(S.odo)} km</h2>
    <div class="item"><span>Corregir odómetro (km del tablero)</span><span><input id="odoIn" type="number" value="${Math.round(S.odo)}"> <button class="btn amb" onclick="S.odo=+$('odoIn').value;save();openMaint()">OK</button></span></div>`+
    S.maint.map((m,i)=>{ const left=Math.round(m.everyKm-(S.odo-m.lastKm)); return `<div class="item"><span>${m.name}<small>${left>0?'Faltan '+left+' km':'Vencido hace '+(-left)+' km'} (cada ${m.everyKm})</small></span><button class="btn go" onclick="S.maint[${i}].lastKm=S.odo;save();openMaint()">Hecho hoy</button></div>`; }).join('')+
    S.dates.map((d,i)=>`<div class="item"><span>${d.name}<small>Vence</small></span><input type="date" value="${d.due}" onchange="S.dates[${i}].due=this.value;save()"></div>`).join(''));
}
function openFuel(){
  const f=S.fuel; let avg='--';
  const full=f.filter(x=>x.full);
  if(full.length>=2){ const a=full[0], b=full[full.length-1]; const km=b.odo-a.odo; const L=full.slice(1).reduce((s,x)=>s+x.liters,0); if(km>0) avg=(L/km*100).toFixed(1); }
  openModal(`<h2>Nafta · promedio real: ${avg} L/100km</h2>
    <div class="item"><span>Cargué (litros)</span><span><input id="fl" type="number" step="0.01"> <button class="btn go" onclick="addFuel(true)">Tanque lleno</button> <button class="btn" onclick="addFuel(false)">Parcial</button></span></div>`+
    f.slice(-6).reverse().map(x=>`<div class="item"><span>${new Date(x.t).toLocaleDateString()} · ${x.liters} L<small>${Math.round(x.odo)} km · ${x.full?'lleno':'parcial'}</small></span></div>`).join(''));
}
function addFuel(full){ const l=parseFloat($('fl').value); if(!(l>0)) return; S.fuel.push({t:Date.now(),liters:l,odo:S.odo,full}); save(); openFuel(); }

function openObd(){
  let body=`<h2>OBD2 · K3-VE</h2>
    <div class="item"><span>Agua<small>Temperatura refrigerante</small></span><b>${obd.temp!=null?Math.round(obd.temp)+'°C':'--'}</b></div>
    <div class="item"><span>Batería<small>Voltaje</small></span><b>${obd.volt!=null?obd.volt.toFixed(1)+' V':'--'}</b></div>
    <div class="item"><span>Admisión<small>Temperatura del aire que entra al motor</small></span><b>${obd.iat!=null?Math.round(obd.iat)+'°C':'--'}</b></div>
    <div class="item"><span>MAF<small>Si el auto no lo reporta, L/100 queda en --</small></span><b>${obd.maf!=null?obd.maf.toFixed(1)+' g/s':'no disponible'}</b></div>
    <div class="item"><span>Check engine<small>${obd.proto?'Protocolo '+obd.proto:'Se lee al conectar'}</small></span><b>${obd.mil==null?'--':obd.mil?'ENCENDIDO':'apagado'}</b></div>
    <h2 style="margin-top:12px">Códigos de falla</h2>
    <div class="row" style="margin-bottom:10px"><button class="btn go" onclick="scanDtc()">Escanear códigos</button><button class="btn amb" onclick="startSim()">Modo demo</button></div>
    <div id="dtcBox"></div>`;
  if(BT){ body+=`<h2 style="margin-top:12px">Adaptadores emparejados</h2><div id="btList">Buscando…</div>`; }
  else body+=`<div class="item">Conexión Bluetooth disponible solo dentro de la APK.</div>`;
  openModal(body);
  renderDtc();
  if(BT) BT.list(l=>{ $('btList').innerHTML = l.length? l.map(d=>`<div class="item"><span>${d.name||'(sin nombre)'}<small>${d.address}</small></span><button class="btn go" onclick="connectObd('${d.address}')">Conectar</button></div>`).join('') : 'Emparejá primero el ELM327 en Ajustes de Android (PIN 1234 o 0000).'; }, ()=>{ $('btList').textContent='Error leyendo Bluetooth'; });
}
function setLook(k,v){ S[k]=v; save(); applyLook(); openSettings(); }
function editGreet(){ const g=prompt('Saludo (dejalo vacío para ocultarlo)', S.greet||''); if(g!==null) setLook('greet', g.trim()); }
function openSettings(){
  openModal(`<h2>Ajustes</h2>`+
    `<div class="item"><span>Saludo<small>${S.greet||'(oculto)'}</small></span><button class="btn" onclick="editGreet()">Cambiar</button></div>`+
    `<div class="item"><span>Color de fondo<small>${(BGS.find(b=>b[0]===S.bg)||BGS[0])[1]}</small></span><span class="swatches">${BGS.map(b=>`<button class="sw ${S.bg===b[0]?'on':''}" style="--s:${b[0]}" onclick="setLook('bg','${b[0]}')" aria-label="${b[1]}"></button>`).join('')}</span></div>`+
    `<div class="item"><span>Lado del volante<small>${S.side==='lhd'?'Izquierda: apps a la izquierda':'Derecha (Passo japonés): apps a la derecha, cerca tuyo'}</small></span><button class="btn" onclick="setLook('side','${S.side==='lhd'?'rhd':'lhd'}')">Invertir lados</button></div>`+
    `<div class="item"><span>Íconos de apps<small>${S.mono?'Monocromo: integrados al tema oscuro':'Color: los originales de cada app'}</small></span><button class="btn ${S.mono?'':'go'}" onclick="S.mono=!S.mono;save();renderApps();openSettings()">${S.mono?'Pasar a color':'Pasar a monocromo'}</button></div>`+
    S.apps.map((a,i)=>`<div class="item"><span>${a.n}<small>${a.pkg}${realIcons[a.pkg]?'':' · no instalada o sin detectar'}</small></span><button class="btn" onclick="editApp(${i})">Cambiar paquete</button></div>`).join('')+
    `<div class="item"><span>Adaptador OBD guardado<small>${S.obdAddr||'ninguno'}</small></span>${S.obdAddr?`<button class="btn go" onclick="connectObd(S.obdAddr)">Reconectar</button>`:''}</div>`);
}
function editApp(i){ const p=prompt('Nombre de paquete Android', S.apps[i].pkg); if(p){ S.apps[i].pkg=p.trim(); save(); renderApps(); loadIcons().then(openSettings); } }

/* ================= Noche ================= */
let night=false; function toggleNight(){ night=!night; $('night').style.opacity=night?.65:0; }

/* ================= Auto-reconexión OBD al arrancar ================= */
document.addEventListener('deviceready',()=>{ BT = window.bluetoothSerial; loadIcons(); if(S.obdAddr && BT) connectObd(S.obdAddr); });
// Al volver al launcher (ej. después de instalar una app) refrescar íconos
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) loadIcons(); });
renderObd(); refreshAlerts();
</script>
