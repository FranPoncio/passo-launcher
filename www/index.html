<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Passo Launcher</title>
<style>
  /* Fuentes locales: el launcher funciona sin internet */
  @font-face { font-family:'Inter'; font-weight:400; src:url(fonts/inter-latin-400-normal.woff2) format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:600; src:url(fonts/inter-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:700; src:url(fonts/inter-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:800; src:url(fonts/inter-latin-800-normal.woff2) format('woff2'); }
  @font-face { font-family:'Inter'; font-weight:900; src:url(fonts/inter-latin-900-normal.woff2) format('woff2'); }
  @font-face { font-family:'JB'; font-weight:700; src:url(fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family:'JB'; font-weight:800; src:url(fonts/jetbrains-mono-latin-800-normal.woff2) format('woff2'); }

  :root {
    --bg:#000; --soft:rgba(255,255,255,.06); --soft2:rgba(255,255,255,.1);
    --txt:#fff; --mut:#71717a; --mut2:#a1a1aa;
    --ok:#10b981; --ok2:#34d399; --cold:#38bdf8; --bad:#ef4444; --amb:#fbbf24; --acc:#10b981;
  }
  * { box-sizing:border-box; margin:0; padding:0; border:0; outline:0; -webkit-user-select:none; user-select:none; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:var(--bg); color:var(--txt); font-family:'Inter',system-ui,sans-serif; overflow:hidden; transition:background .45s; }
  .mono { font-family:'JB',ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  body { display:grid; grid-template-rows:9vh 1fr 12vh; padding:1.6vh 2.4vh 1.8vh; gap:1vh; }
  button { font:inherit; color:inherit; background:none; cursor:pointer; }
  .tap { transition:transform .15s cubic-bezier(.16,1,.3,1), opacity .2s; }
  .tap:active { transform:scale(.9); }
  .pill { background:var(--soft); border-radius:99px; }
  svg.i { fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }

  /* ---------- Barra superior ---------- */
  header { display:flex; align-items:center; justify-content:space-between; }
  .hl, .hr { display:flex; align-items:center; gap:2vh; }
  .greet { font-weight:800; letter-spacing:.22em; font-size:1.9vh; text-transform:uppercase; }
  .brand { font-weight:800; letter-spacing:.16em; font-size:1.9vh; color:var(--bad); }
  #badge { display:flex; align-items:center; gap:1vh; font-size:1.6vh; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:.9vh 2vh; border-radius:99px; background:rgba(16,185,129,.15); color:var(--ok2); }
  #badge i { width:1.1vh; height:1.1vh; border-radius:50%; background:currentColor; box-shadow:0 0 1.2vh currentColor; }
  #badge.cold { background:rgba(56,189,248,.14); color:var(--cold); }
  #badge.bad { background:rgba(239,68,68,.2); color:#fca5a5; }
  #badge.sim { background:rgba(251,191,36,.13); color:var(--amb); }
  .hbtn { display:flex; align-items:center; gap:1vh; padding:1vh 2.2vh; font-size:1.7vh; font-weight:700; color:#d4d4d8; }
  .hbtn svg { width:2.2vh; height:2.2vh; }
  .hicon { color:var(--mut2); padding:1vh; } .hicon svg { width:2.6vh; height:2.6vh; }
  #clock { font-size:4.4vh; font-weight:800; letter-spacing:.02em; }

  /* ---------- Centro de la pantalla ---------- */
  main { display:grid; grid-template-columns:24% 1fr 23%; gap:2vh; min-height:0; }
  main.lhd > :nth-child(1) { order:3; } main.lhd > :nth-child(3) { order:1; }
  .col { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:0; }

  /* Izquierda: velocímetro */
  .gauge { position:relative; width:100%; max-width:38vh; aspect-ratio:1/.82; }
  .gauge svg { width:100%; height:100%; overflow:visible; }
  .gauge .c { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-top:9%; }
  #speed { font-size:13vh; font-weight:900; line-height:.9; letter-spacing:-.05em; }
  .unit { font-size:1.45vh; letter-spacing:.24em; color:var(--mut); font-weight:800; text-transform:uppercase; margin-top:1vh; }
  #rpm { font-size:1.75vh; font-weight:800; color:var(--ok2); margin-top:.8vh; letter-spacing:.06em; }
  .tiles { display:flex; gap:3.4vh; margin-top:2.2vh; }
  .tile { text-align:center; }
  .tile small { display:block; font-size:1.3vh; letter-spacing:.18em; color:var(--mut); font-weight:800; text-transform:uppercase; margin-bottom:.6vh; }
  .tile span { font-size:3.6vh; font-weight:800; white-space:nowrap; }
  .tile span small { display:inline; font-size:1.7vh; color:var(--mut); letter-spacing:0; }
  .lnk { margin-top:2.4vh; display:flex; align-items:center; gap:1vh; padding:1vh 2.2vh; font-size:1.55vh; font-weight:700; color:#d4d4d8; }
  .lnk svg { width:2vh; height:2vh; color:var(--ok2); }

  /* Centro: el auto */
  .stage { position:relative; width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .stage::before { content:''; position:absolute; inset:6% 4% 14%; background:radial-gradient(ellipse 60% 52% at 50% 58%, color-mix(in srgb, var(--acc) 22%, transparent), transparent 70%); pointer-events:none; transition:background .6s; }
  .model { position:relative; font-size:1.45vh; letter-spacing:.34em; font-weight:800; color:var(--mut); text-transform:uppercase; }
  .model b { color:#e4e4e7; }
  .car { position:relative; width:100%; max-width:62vh; margin-top:1.2vh; }
  .car svg, .car img { display:block; width:100%; height:auto; }
  .car img { aspect-ratio:480/232; object-fit:cover; border-radius:3vh; -webkit-mask-image:radial-gradient(ellipse 70% 70% at 50% 50%, #000 55%, transparent 100%); mask-image:radial-gradient(ellipse 70% 70% at 50% 50%, #000 55%, transparent 100%); }
  .car .lamp { transition:opacity .5s; }
  #alerts { position:relative; min-height:3.6vh; margin-top:.4vh; display:flex; gap:1vh; flex-wrap:wrap; justify-content:center; }
  #alerts span { font-size:1.55vh; font-weight:800; padding:.8vh 1.8vh; border-radius:99px; background:rgba(251,191,36,.12); color:var(--amb); }
  #alerts span.r { background:rgba(239,68,68,.18); color:#fca5a5; }
  .stats { position:relative; display:grid; grid-template-columns:repeat(4,1fr); gap:1.2vh; width:100%; max-width:80vh; margin-top:1.4vh; }
  .stat { background:var(--soft); border-radius:2.2vh; padding:1.3vh 1.4vh; text-align:center; }
  .stat small { display:block; font-size:1.2vh; letter-spacing:.18em; color:var(--mut); font-weight:800; text-transform:uppercase; }
  .stat b { display:block; font-size:2.3vh; font-weight:800; margin-top:.5vh; white-space:nowrap; }
  .stat b.warn { color:var(--amb); } .stat b.bad { color:#f87171; } .stat b.good { color:var(--ok2); }

  /* Derecha: apps */
  .apps { display:grid; grid-template-columns:repeat(2,1fr); gap:3.2vh 1vh; width:100%; }
  .app { display:flex; flex-direction:column; align-items:center; gap:1.1vh; font-size:1.65vh; font-weight:700; color:#e4e4e7; }
  .app .ico { width:7vh; height:7vh; display:flex; align-items:center; justify-content:center; }
  .app img { width:7vh; height:7vh; border-radius:1.9vh; object-fit:cover; transition:filter .3s; }
  .fb { width:7vh; height:7vh; border-radius:2.2vh; display:flex; align-items:center; justify-content:center; background:color-mix(in srgb, var(--c) 15%, transparent); color:var(--c); }
  .fb svg { width:3.6vh; height:3.6vh; }
  body.mono-ic .app img, body.mono-ic .dr img { filter:grayscale(1) brightness(1.15); }
  body.mono-ic .fb { background:var(--soft); color:#e4e4e7; }
  .work { margin-top:4.4vh; width:100%; display:flex; align-items:center; justify-content:center; gap:1.2vh; padding:1.7vh; font-size:1.6vh; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--amb); }
  .work svg { width:2.2vh; height:2.2vh; }
  .work.on { background:rgba(251,191,36,.16); }

  /* ---------- Dock inferior ---------- */
  footer { display:flex; align-items:center; justify-content:space-between; gap:2vh; }
  .side { display:flex; align-items:center; gap:1.2vh; padding:1.5vh 2.6vh; font-size:1.65vh; font-weight:800; color:#e4e4e7; }
  .side svg { width:2.3vh; height:2.3vh; }
  .dock { display:flex; align-items:center; gap:3.4vh; padding:1.1vh 1.4vh 1.1vh 3.4vh; border-radius:99px; background:var(--soft); }
  .dk { display:flex; align-items:center; gap:.9vh; font-size:1.7vh; font-weight:800; color:var(--c); white-space:nowrap; }
  .dk svg { width:2.2vh; height:2.2vh; }
  .dk img { width:2.8vh; height:2.8vh; border-radius:.7vh; }
  .allapps { width:6.6vh; height:6.6vh; border-radius:50%; background:#fff; color:#000; display:flex; align-items:center; justify-content:center; }
  .allapps svg { width:2.8vh; height:2.8vh; }

  /* ---------- Paneles (modales) ---------- */
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.94); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); display:none; flex-direction:column; padding:4vh 6vh; z-index:30; overflow:auto; }
  #modal.on { display:flex; animation:up .28s cubic-bezier(.16,1,.3,1); }
  @keyframes up { from { opacity:0; transform:translateY(2vh); } to { opacity:1; transform:none; } }
  #modal h2 { font-size:3.2vh; font-weight:900; margin-bottom:2.2vh; letter-spacing:-.01em; }
  #modal h2 small { font-size:1.8vh; color:var(--mut); font-weight:700; margin-left:1vh; }
  #modal .x { position:fixed; right:4vh; top:3vh; width:6vh; height:6vh; border-radius:50%; background:var(--soft2); display:flex; align-items:center; justify-content:center; }
  #modal .x svg { width:2.6vh; height:2.6vh; }
  .item { display:flex; align-items:center; justify-content:space-between; gap:1.4vh; padding:1.9vh 2.2vh; background:var(--soft); border-radius:2.4vh; margin-bottom:1.1vh; font-weight:700; font-size:1.9vh; }
  .item small { color:var(--mut); font-weight:600; display:block; margin-top:.3vh; font-size:1.55vh; }
  .item b { font-size:2.2vh; }
  .btn { padding:1.5vh 2.6vh; border-radius:99px; background:var(--soft2); font-weight:800; font-size:1.6vh; text-transform:uppercase; letter-spacing:.06em; white-space:nowrap; }
  .btn.go { background:var(--ok); color:#022c22; } .btn.stop { background:#dc2626; color:#fff; } .btn.amb { background:rgba(251,191,36,.18); color:var(--amb); }
  .row { display:flex; gap:1.2vh; }
  .row > .btn { flex:1; }
  input { background:var(--soft2); color:#fff; border-radius:1.6vh; padding:1.4vh 1.8vh; font:inherit; font-size:1.9vh; width:22vh; color-scheme:dark; }
  .grid4 { display:grid; grid-template-columns:repeat(4,1fr); gap:1.2vh; }
  .big { text-align:center; padding:2vh; background:var(--soft); border-radius:2.4vh; }
  .big b { display:block; font-size:4vh; font-weight:900; }
  .big small { font-size:1.3vh; letter-spacing:.16em; color:var(--mut); font-weight:800; text-transform:uppercase; }
  .drawer { display:grid; grid-template-columns:repeat(6,1fr); gap:4vh 2vh; padding:2vh 0; }
  .dr { display:flex; flex-direction:column; align-items:center; gap:1.2vh; font-size:1.65vh; font-weight:700; color:#e4e4e7; text-align:center; }
  .dr img, .dr .fb { width:8vh; height:8vh; border-radius:2.2vh; }
  .swatches { display:flex; gap:1.2vh; }
  .sw { width:5.4vh; height:5.4vh; border-radius:1.6vh; background:var(--s); box-shadow:inset 0 0 0 2px #3f3f46; }
  .sw.on { box-shadow:inset 0 0 0 4px var(--ok); }
  .dtc { display:flex; gap:1.8vh; align-items:center; padding:1.8vh 2vh; background:var(--soft); border-radius:2vh; margin-bottom:1vh; }
  .dtc b { font-size:2.4vh; font-weight:900; color:var(--amb); min-width:11vh; }
  .dtc span { font-weight:600; color:#d4d4d8; font-size:1.8vh; }

  #toast { position:fixed; top:2vh; left:50%; transform:translate(-50%,-1vh); background:rgba(39,39,42,.95); padding:1.4vh 2.8vh; border-radius:99px; font-size:1.8vh; font-weight:800; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; z-index:60; display:flex; align-items:center; gap:1.3vh; white-space:nowrap; }
  #toast.on { opacity:1; transform:translate(-50%,0); }
  #toast i { width:1.2vh; height:1.2vh; border-radius:50%; background:var(--ok); }
  #toast.warn i { background:var(--amb); } #toast.err i { background:var(--bad); }
  #night { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .4s; z-index:40; }
  #danger { position:fixed; inset:0; pointer-events:none; z-index:20; display:none; background:radial-gradient(circle,transparent 55%,rgba(239,68,68,.45) 100%); animation:pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:0} 50%{opacity:1} }
</style>
</head>
<body>
<div id="night"></div><div id="danger"></div><div id="toast"><i></i><span id="toastTxt"></span></div>

<header>
  <div class="hl">
    <span class="greet" id="greet"></span>
    <span class="brand">PASSO 1.3</span>
    <button id="badge" class="tap sim" onclick="openObd()"><i></i><span id="badgeTxt">Sin OBD</span></button>
  </div>
  <div class="hr">
    <button class="tap pill hbtn" onclick="saveParking()" data-ic="pin"><span id="parkLbl">Guardar parking</span></button>
    <button class="tap hicon" onclick="toggleNight()" data-ic="moon" aria-label="Modo noche"></button>
    <div id="clock" class="mono">--:--</div>
  </div>
</header>

<main>
  <!-- Izquierda: motor -->
  <section class="col">
    <div class="gauge tap" onclick="openObd()">
      <svg viewBox="0 0 200 150">
        <path d="M 25 130 A 80 80 0 1 1 175 130" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="11" stroke-linecap="round"/>
        <path id="arc" d="M 25 130 A 80 80 0 1 1 175 130" fill="none" stroke="#10b981" stroke-width="11" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330" style="transition:stroke-dashoffset .3s,stroke .3s;filter:drop-shadow(0 0 6px currentColor)"/>
      </svg>
      <div class="c">
        <div id="speed">0</div>
        <div class="unit">km/h GPS</div>
        <div id="rpm" class="mono">-- RPM</div>
      </div>
    </div>
    <div class="tiles">
      <div class="tile"><small>Agua</small><span id="temp" class="mono">--</span></div>
      <div class="tile"><small>Batería</small><span id="volt" class="mono">--</span></div>
      <div class="tile"><small>L/100</small><span id="cons" class="mono">--</span></div>
    </div>
    <button class="tap pill lnk" onclick="openObd()" data-ic="obd">Diagnóstico OBD</button>
  </section>

  <!-- Centro: el auto -->
  <section class="stage">
    <div class="model">Toyota <b>Passo</b> · K3-VE 1.3</div>
    <div class="car tap" id="car" onclick="openMaint()"></div>
    <div id="alerts"></div>
    <div class="stats">
      <div class="stat"><small>Odómetro</small><b id="stOdo" class="mono">--</b></div>
      <div class="stat"><small>Service</small><b id="stSvc" class="mono">--</b></div>
      <div class="stat"><small>WoF</small><b id="stWof" class="mono">--</b></div>
      <div class="stat"><small>Rego</small><b id="stRego" class="mono">--</b></div>
    </div>
  </section>

  <!-- Derecha: apps -->
  <section class="col">
    <div class="apps" id="apps"></div>
    <button class="tap pill work" id="workBtn" onclick="openShift()" data-ic="briefcase"><span id="workLbl">Modo trabajo</span></button>
  </section>
</main>

<footer>
  <button class="tap pill side" onclick="openSettings()" data-ic="palette">Ajustes launcher</button>
  <div class="dock" id="dock"></div>
  <button class="tap pill side" onclick="openAndroid()" data-ic="sliders">Ajustes Android</button>
</footer>

<div id="modal"><button class="x tap" onclick="closeModal()" data-ic="close" aria-label="Cerrar"></button><div id="modalBody"></div></div>

<script>
/* ================= Íconos de línea propios (sin internet) ================= */
const ICONS = {
  map:'<path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/>',
  nav:'<path d="M12 3 5 20l7-4 7 4z"/>',
  car:'<path d="M3 16v-3.5L5 8a2 2 0 0 1 1.8-1h10.4A2 2 0 0 1 19 8l2 4.5V16a1 1 0 0 1-1 1h-1"/><path d="M5 17H4a1 1 0 0 1-1-1M9 17h6M3 12.5h18"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/>',
  bag:'<path d="M4.5 8h15l-1.3 11.2a2 2 0 0 1-2 1.8H7.8a2 2 0 0 1-2-1.8z"/><path d="M9 8V7a3 3 0 0 1 6 0v1"/>',
  music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  play:'<circle cx="12" cy="12" r="9"/><path d="m10 8.5 5.5 3.5-5.5 3.5z"/>',
  app:'<rect x="4" y="4" width="16" height="16" rx="4"/>',
  pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.2L3.5 17.3a1.8 1.8 0 0 0 2.5 2.5l5.8-5.8a4 4 0 0 0 5.2-5.4l-2.6 2.6-2.3-.5-.5-2.3z"/>',
  fuel:'<path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10"/><path d="M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V9l-3-3"/>',
  obd:'<path d="M3 12h4l3-7 4 14 3-7h4"/>',
  sliders:'<path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',
  grid:'<rect x="4" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.6"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.6"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.6"/>',
  moon:'<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  close:'<path d="M6 6l12 12M18 6 6 18"/>',
  palette:'<path d="M12 3a9 9 0 1 0 0 18c1.2 0 1.8-.8 1.8-1.7 0-1.3-1-1.6-1-2.6 0-.9.7-1.6 1.6-1.6H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1.2"/><circle cx="10" cy="7" r="1.2"/><circle cx="14.5" cy="7" r="1.2"/>',
  briefcase:'<rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 13h18"/>',
  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  chat:'<path d="M20 12a8 8 0 0 1-11.6 7.1L4 20l1-4.2A8 8 0 1 1 20 12z"/>',
  bolt:'<path d="M13 3 5 14h6l-1 7 8-11h-6z"/>',
  star:'<path d="M12 3l1.8 5.5L19.5 10l-5.7 1.5L12 17l-1.8-5.5L4.5 10l5.7-1.5z"/>',
  radio:'<rect x="3" y="8" width="18" height="12" rx="2.5"/><path d="M7 8l10-4"/><circle cx="15.5" cy="14" r="2.5"/><path d="M6.5 12.5h4M6.5 15.5h4"/>',
  phone:'<path d="M5 4h3.5l1.5 4.5-2 1.3a11 11 0 0 0 6.2 6.2l1.3-2 4.5 1.5V19a1.5 1.5 0 0 1-1.6 1.5A16 16 0 0 1 3.5 5.6 1.5 1.5 0 0 1 5 4z"/>',
  cast:'<rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="m10 8.5 4.5 2.5-4.5 2.5z"/>',
  store:'<path d="M5 8h14l-1.2 11.2A2 2 0 0 1 15.8 21H8.2a2 2 0 0 1-2-1.8z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  video:'<rect x="3" y="6" width="13" height="12" rx="2.5"/><path d="m16 10 5-3v10l-5-3"/>'
};
const svg = k => `<svg class="i" viewBox="0 0 24 24">${ICONS[k]||ICONS.app}</svg>`;
const $ = id => document.getElementById(id);

/* ================= Estado persistente ================= */
const DEF = {
  odo: 0,
  maint: [
    { name:'Aceite motor',  everyKm:5000,  lastKm:0 },
    { name:'Filtro de aire',everyKm:15000, lastKm:0 },

/* ================= GPS real: velocidad + km ================= */
let gpsLast=null, speedKmh=0;
function hav(a,b,c,d){ const R=6371,r=x=>x*Math.PI/180; const dl=r(c-a),dn=r(d-b); const h=Math.sin(dl/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dn/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
if (navigator.geolocation) {
  navigator.geolocation.watchPosition(p=>{
    const c=p.coords;
    speedKmh = c.speed!=null && !isNaN(c.speed) ? Math.max(0,c.speed*3.6) : speedKmh;
    if (c.accuracy<=30) {
      if (gpsLast) { const d=hav(gpsLast.lat,gpsLast.lon,c.latitude,c.longitude); if (d>0.005 && d<1) { S.odo+=d; } }
      gpsLast={lat:c.latitude,lon:c.longitude};
    }
    $('speed').textContent=Math.round(speedKmh<3?0:speedKmh);
  }, ()=>{}, { enableHighAccuracy:true, maximumAge:1000, timeout:10000 });
}

/* ================= OBD2 (ELM327 Bluetooth clásico) ================= */
const obd = { rpm:null, temp:null, volt:null, maf:null, iat:null, mil:null, dtcCount:null, proto:'', ok:false, sim:false };
let BT = window.bluetoothSerial;
let buf='', waiter=null, pollTimer=null, pollN=0;
let cmdQueue = Promise.resolve();
function cmd(c, ms){ const p = cmdQueue.then(()=>btWrite(c, ms)); cmdQueue = p.catch(()=>{}); return p; }
function btWrite(cmd, ms){
  return new Promise(res=>{
    waiter = res; buf='';
    BT.write(cmd+'\r', ()=>{}, ()=>{ waiter=null; res(''); });
    setTimeout(()=>{ if(waiter===res){ waiter=null; res(buf); } }, ms||1500);
  });
}
function parseHex(resp, pid){
  const s = resp.replace(/[\s>]/g,'').toUpperCase();
  const k = '41'+pid; const i = s.indexOf(k);
  if (i<0) return null;
  const h = s.slice(i+k.length); const out=[];
  for (let j=0;j+1<h.length;j+=2) out.push(parseInt(h.substr(j,2),16));
  return out;
}
async function obdInit(){
  await cmd('ATZ', 4000);
  for (const c of ['ATE0','ATL0','ATS0','ATH0','ATSP0']) await cmd(c);
  await cmd('0100', 10000);
  obd.proto = (await cmd('ATDPN')).replace(/[\s>]/g,'').toUpperCase();
}
async function obdPoll(){
  let r;
  r = parseHex(await cmd('010C'),'0C'); if(r&&r.length>=2) obd.rpm = ((r[0]*256)+r[1])/4;
  r = parseHex(await cmd('0105'),'05'); if(r&&r.length>=1) obd.temp = r[0]-40;
  r = parseHex(await cmd('0142'),'42'); if(r&&r.length>=2) obd.volt = ((r[0]*256)+r[1])/1000;
  r = parseHex(await cmd('0110'),'10'); obd.maf = (r&&r.length>=2) ? ((r[0]*256)+r[1])/100 : null;
  if (pollN % 5 === 0) { r = parseHex(await cmd('010F'),'0F'); obd.iat = (r&&r.length>=1) ? r[0]-40 : null; }
  if (pollN % 25 === 0) { r = parseHex(await cmd('0101'),'01'); if(r&&r.length>=1){ obd.mil = !!(r[0]&0x80); obd.dtcCount = r[0]&0x7F; } }
  pollN++;
  obd.ok = true; renderObd();
}

/* ---------- Códigos de falla (DTC): modo 03 leer, modo 04 borrar ---------- */
const DTC_INFO = {
  P0100:'Sensor MAF (caudal de aire): falla de circuito', P0101:'Sensor MAF: lectura fuera de rango', P0102:'Sensor MAF: señal baja', P0103:'Sensor MAF: señal alta',
  P0110:'Sensor de temperatura de admisión: falla de circuito', P0115:'Sensor de temperatura del refrigerante: falla de circuito', P0116:'Sensor de temperatura del refrigerante: lectura fuera de rango',
  P0120:'Sensor de posición del acelerador (TPS): falla de circuito', P0125:'El motor tarda en llegar a temperatura (revisar termostato)', P0128:'Termostato: temperatura del refrigerante por debajo de lo normal',
  P0130:'Sonda lambda (antes del catalizador): falla de circuito', P0133:'Sonda lambda (antes del catalizador): respuesta lenta', P0135:'Sonda lambda (antes del catalizador): falla del calefactor',
  P0136:'Sonda lambda (después del catalizador): falla de circuito', P0141:'Sonda lambda (después del catalizador): falla del calefactor',
  P0171:'Mezcla demasiado pobre (posible entrada de aire o MAF sucio)', P0172:'Mezcla demasiado rica',
  P0300:'Fallo de encendido aleatorio', P0301:'Fallo de encendido en cilindro 1', P0302:'Fallo de encendido en cilindro 2', P0303:'Fallo de encendido en cilindro 3', P0304:'Fallo de encendido en cilindro 4',
  P0325:'Sensor de detonación: falla de circuito', P0335:'Sensor de posición del cigüeñal: falla de circuito', P0340:'Sensor de posición del árbol de levas: falla de circuito',
  P0420:'Eficiencia del catalizador por debajo del mínimo', P0440:'Sistema de evaporación (EVAP): falla', P0441:'EVAP: flujo de purga incorrecto', P0442:'EVAP: pérdida chica (revisar tapa de nafta)',
  P0446:'EVAP: falla en el control de ventilación', P0455:'EVAP: pérdida grande (revisar tapa de nafta)', P0500:'Sensor de velocidad del vehículo: falla',
  P0505:'Sistema de control de ralentí: falla', P0560:'Voltaje del sistema: falla', P0700:'La caja automática reporta una falla (leer su propio código)'
};
function dtcDesc(c){
  if (DTC_INFO[c]) return DTC_INFO[c];
  if (/^P1/.test(c)) return 'Código propio de Toyota/Daihatsu: buscalo junto con "Passo"';
  return 'Buscalo en internet con el código exacto';
}
function decodeDtc(a,b){
  if (a===0 && b===0) return null;
  return 'PCBU'[a>>6] + ((a>>4)&3) + (a&15).toString(16).toUpperCase() + b.toString(16).toUpperCase().padStart(2,'0');
}
function parseDtcResponse(resp){
  if (/NO ?DATA/i.test(resp)) return [];
  const isCan = /^A?[6-9AB]$/.test(obd.proto);
  const lines = resp.toUpperCase().split(/[\r\n]+/)
    .map(l=>l.replace(/^\s*[0-9A-F]:/,'').replace(/[\s>]/g,''))
    .filter(l=>/^[0-9A-F]+$/.test(l) && l.length>3);
  const bytes = [];
  if (isCan) {
    const all = lines.join(''); const i = all.indexOf('43'); if (i<0) return null;
    const h = all.slice(i+4);
    for (let j=0;j+1<h.length;j+=2) bytes.push(parseInt(h.substr(j,2),16));
  } else {
    let found=false;
    lines.forEach(l=>{ if(!l.startsWith('43')) return; found=true; const h=l.slice(2,14); for(let j=0;j+1<h.length;j+=2) bytes.push(parseInt(h.substr(j,2),16)); });
    if (!found) return null;
  }
  const codes=[];
  for (let j=0;j+1<bytes.length;j+=2){ const c=decodeDtc(bytes[j],bytes[j+1]); if(c && !codes.includes(c)) codes.push(c); }
  return codes;
}
async function scanDtc(){
  if (obd.sim) { toast('Modo demo: no hay auto conectado para escanear','warn'); return; }
  if (!BT || !obd.ok) { toast('Conectá el OBD primero','warn'); return; }
  $('dtcBox').innerHTML = '<div class="item">Leyendo la ECU…</div>';
  const resp = await cmd('03', 8000);
  const codes = parseDtcResponse(resp);
  if (codes === null) {
    $('dtcBox').innerHTML = `<div class="item"><span>La ECU no respondió al pedido de códigos<small>Respuesta: ${resp.replace(/[\r\n>]+/g,' ').trim().slice(0,60)||'(vacía)'}. Probá con el motor en contacto.</small></span></div>`;
    return;
  }
  S.lastScan = { t:Date.now(), codes }; save();
  renderDtc();
}
function renderDtc(){
  const s=S.lastScan, box=$('dtcBox'); if(!box) return; if(!s){ box.innerHTML=''; return; }
  const when = new Date(s.t).toLocaleString();
  box.innerHTML = s.codes.length
    ? s.codes.map(c=>`<div class="dtc"><b>${c}</b><span>${dtcDesc(c)}</span></div>`).join('') +
      `<div class="item"><span>Borrar códigos<small>Apaga el check engine, pero no arregla la causa: si la falla sigue, el código vuelve.</small></span><button class="btn stop tap" onclick="clearDtc()">Borrar</button></div>` +
      `<small style="color:var(--mut)">Escaneo: ${when}</small>`
    : `<div class="item"><span>Sin códigos de falla guardados<small>Escaneo: ${when}</small></span></div>`;
}
async function clearDtc(){
  if (!confirm('¿Borrar los códigos de falla? Hacelo con el motor en contacto (sin arrancar). El check engine se apaga, pero si el problema sigue, vuelve a aparecer.')) return;
  const r = await cmd('04', 8000);
  if (/44/.test(r.replace(/\s/g,''))) { toast('Códigos borrados'); S.lastScan={t:Date.now(),codes:[]}; save(); renderDtc(); }
  else toast('La ECU no aceptó el borrado','err');
}
function connectObd(addr){
  if(!BT){ toast('OBD real solo en la APK. Usá modo demo.','warn'); return; }
  BT.connect(addr, async ()=>{
    S.obdAddr=addr; save();
    BT.subscribe('>', d=>{ buf+=d; if(waiter){ const w=waiter; waiter=null; w(buf);} });
    await obdInit(); obd.sim=false; clearInterval(pollTimer);
    const loop=async()=>{ try{ await obdPoll(); }catch(e){} pollTimer=setTimeout(loop,400); }; loop();
    toast('OBD conectado'); closeModal();
  }, ()=>{ toast('No pude conectar al OBD','err'); obd.ok=false; renderObd(); });
}
function startSim(){
  obd.sim=true; clearInterval(pollTimer);
  let t=0; pollTimer=setInterval(()=>{ t+=0.1;
    obd.rpm=1200+Math.abs(Math.sin(t))*2200; obd.temp=Math.min(91,60+t*2); obd.volt=14.1-Math.random()*.1; obd.maf=3+Math.abs(Math.sin(t))*8; obd.ok=true;
    if(!gpsLast){ speedKmh=Math.abs(Math.sin(t))*80; $('speed').textContent=Math.round(speedKmh); }
    renderObd();
  },400); closeModal();
}
function renderObd(){
  const rpm=obd.rpm, t=obd.temp, v=obd.volt;
  $('rpm').textContent = rpm!=null ? Math.round(rpm)+' RPM' : '-- RPM';
  $('temp').textContent = t!=null ? Math.round(t)+'°' : '--';
  $('volt').innerHTML = v!=null ? v.toFixed(1)+'<small>V</small>' : '--';
  let c='--';
  if (obd.maf!=null && speedKmh>8) { const lph=obd.maf/(14.7*740)*3600; c=(lph/speedKmh*100).toFixed(1); }
  $('cons').textContent=c;
  const arc=$('arc'); const frac=Math.min(1,(rpm||0)/6500);
  arc.style.strokeDashoffset = 330-330*frac;
  const hot=t!=null&&t>=100, lowV=v!=null&&v<12.0, cold=t!=null&&t<60;
  const col = hot?'#ef4444': cold?'#38bdf8': (S.acc||'#10b981');
  arc.setAttribute('stroke', col); arc.style.color = col;
  $('danger').style.display = hot?'block':'none';
  const b=$('badge');
  b.className='tap'+(hot?' bad':cold?' cold':'');
  $('badgeTxt').textContent = obd.sim?'Demo': !obd.ok?'Sin OBD': hot?'Temp '+Math.round(t)+'°': obd.mil?'Check engine'+(obd.dtcCount?' ('+obd.dtcCount+')':''): cold?'Motor frío · '+Math.round(t)+'°':'Motor óptimo · '+Math.round(t)+'°';
  if(obd.sim) b.classList.add('sim');
  if(!obd.ok && !obd.sim) b.classList.add('sim');
  if(obd.mil && !hot && !obd.sim) b.className='tap bad';
  const hl=$('headL'); if(hl) hl.setAttribute('opacity', obd.ok||speedKmh>3 ? '1' : '.75');
  refreshAlerts(hot,lowV);
}

/* ================= Alertas + datos del auto ================= */
const fmtKm = n => Math.round(n).toLocaleString('es-AR');
function daysTo(d){ return d ? Math.ceil((new Date(d)-new Date())/864e5) : null; }
function refreshAlerts(hot,lowV){
  const a=[];
  if(hot) a.push(['Motor recalentado: parate','r']);
  if(lowV) a.push(['Batería baja (menos de 12 V)','r']);
  S.maint.forEach(m=>{ const left=m.everyKm-(S.odo-m.lastKm); if(left<=0) a.push([m.name+' vencido','r']); else if(left<500) a.push([m.name+' en '+Math.round(left)+' km','']); });
  S.dates.forEach(d=>{ const days=daysTo(d.due); if(days==null) return; if(days<0) a.push([d.name+' vencido','r']); else if(days<=30) a.push([d.name+' en '+days+' días','']); });
  $('alerts').innerHTML = a.slice(0,3).map(x=>`<span class="${x[1]}">${x[0]}</span>`).join('');
  // tarjetas bajo el auto
  $('stOdo').textContent = S.odo>0 ? fmtKm(S.odo)+' km' : 'Cargar';
  const next = S.maint.map(m=>({n:m.name, left:m.everyKm-(S.odo-m.lastKm)})).sort((x,y)=>x.left-y.left)[0];
  const sv=$('stSvc'); sv.textContent = next.left<=0 ? 'Vencido' : fmtKm(next.left)+' km'; sv.className='mono '+(next.left<=0?'bad':next.left<500?'warn':'good');
  [['stWof',0],['stRego',1]].forEach(([id,i])=>{ const d=daysTo(S.dates[i]&&S.dates[i].due), el=$(id);
    el.textContent = d==null ? 'Cargar' : d<0 ? 'Vencido' : d+' días';
    el.className = 'mono '+(d==null?'':d<0?'bad':d<=30?'warn':'good'); });
}

/* ================= Turno (modo trabajo) ================= */
function toggleShift(){
  if(!S.shift){ S.shift={start:Date.now(),km0:S.odo,money:0,trips:0}; save(); toast('Turno iniciado'); }
  else if(confirm('¿Terminar turno?')){ const s=S.shift; S.shift=null; save(); renderShift(); showShiftSummary(s); return; }
  renderShift(); openShift();
}
function addTrip(){
  if(!S.shift){ toast('Iniciá el turno primero','warn'); return; }
  const v=parseFloat(prompt('Ganancia del pedido ($)'));
  if(!isNaN(v)&&v>0){ S.shift.money+=v; S.shift.trips++; save(); renderShift(); }
}
function showShiftSummary(s){
  const h=(Date.now()-s.start)/36e5, km=S.odo-s.km0;
  openModal(`<h2>Resumen del turno</h2><div class="grid4">
    <div class="big"><b class="mono">${h.toFixed(1)} h</b><small>Tiempo</small></div>
    <div class="big"><b class="mono">${km.toFixed(1)}</b><small>Km</small></div>
    <div class="big"><b class="mono">$${s.money.toFixed(0)}</b><small>Ganado</small></div>
    <div class="big"><b class="mono">$${(s.money/Math.max(h,.01)).toFixed(0)}</b><small>Por hora</small></div></div>`);
}
function openShift(){
  openModal(`<h2>Modo trabajo <small>delivery</small></h2>
    <div class="grid4" style="margin-bottom:1.4vh">
      <div class="big"><b class="mono" id="shTime">0:00</b><small>Tiempo</small></div>
      <div class="big"><b class="mono" id="shKm">0.0</b><small>Km</small></div>
      <div class="big"><b class="mono" id="shMoney">$0</b><small>Ganado</small></div>
      <div class="big"><b class="mono" id="shTrips">0</b><small>Pedidos</small></div>
      <div class="big"><b class="mono" id="shHr">$0</b><small>Por hora</small></div>
      <div class="big"><b class="mono" id="shKmM">$0.00</b><small>Por km</small></div>
      <button class="big tap" onclick="closeModal();openApp(S.apps[2].pkg)"><b style="font-size:2.6vh">${S.apps[2].n}</b><small>Abrir</small></button>
      <button class="big tap" onclick="closeModal();openApp(S.apps[3].pkg)"><b style="font-size:2.6vh">${S.apps[3].n}</b><small>Abrir</small></button>
    </div>
    <div class="row"><button class="btn tap" id="shBtn" onclick="toggleShift()">Iniciar turno</button><button class="btn amb tap" onclick="addTrip()">+ Pedido</button></div>`);
  renderShift();
}
function renderShift(){
  const s=S.shift;
  $('workLbl').textContent = s ? 'Turno · '+Math.floor((Date.now()-s.start)/36e5)+':'+String(Math.floor(((Date.now()-s.start)/6e4)%60)).padStart(2,'0') : 'Modo trabajo';
  $('workBtn').classList.toggle('on', !!s);
  if(!$('shTime')) return;
  $('shBtn').textContent = s?'Terminar turno':'Iniciar turno';
  $('shBtn').className = 'btn tap '+(s?'stop':'go');
  if(!s) return;
  const ms=Date.now()-s.start, h=ms/36e5, km=S.odo-s.km0;
  $('shTime').textContent=Math.floor(h)+':'+String(Math.floor((ms/6e4)%60)).padStart(2,'0');
  $('shKm').textContent=km.toFixed(1);
  $('shMoney').textContent='$'+s.money.toFixed(0);
  $('shHr').textContent='$'+(s.money/Math.max(h,.05)).toFixed(0);
  $('shKmM').textContent='$'+(s.money/Math.max(km,.1)).toFixed(2);
  $('shTrips').textContent=s.trips;
}
setInterval(renderShift,5000);

/* ================= Parking ================= */
function saveParking(){
  if(!gpsLast){ toast('Sin señal GPS todavía','warn'); return; }
  S.parking={lat:gpsLast.lat,lon:gpsLast.lon,t:Date.now()}; save(); $('parkLbl').textContent='Guardado'; setTimeout(()=>$('parkLbl').textContent='Guardar parking',2500);
  toast('Parking guardado');
}

/* ================= Paneles ================= */
function openModal(h){ $('modalBody').innerHTML=h; $('modal').classList.add('on'); }
function closeModal(){ $('modal').classList.remove('on'); refreshAlerts(); }

function openMaint(){
  openModal(`<h2>Service <small>odómetro ${fmtKm(S.odo)} km</small></h2>
    <div class="item"><span>Corregir odómetro<small>Poné los km que marca el tablero</small></span><span class="row"><input id="odoIn" type="number" value="${Math.round(S.odo)}"><button class="btn amb tap" onclick="S.odo=+$('odoIn').value;save();openMaint()">OK</button></span></div>`+
    S.maint.map((m,i)=>{ const left=Math.round(m.everyKm-(S.odo-m.lastKm)); return `<div class="item"><span>${m.name}<small>${left>0?'Faltan '+fmtKm(left)+' km':'Vencido hace '+fmtKm(-left)+' km'} (cada ${fmtKm(m.everyKm)} km)</small></span><button class="btn go tap" onclick="S.maint[${i}].lastKm=S.odo;save();openMaint()">Hecho hoy</button></div>`; }).join('')+
    S.dates.map((d,i)=>`<div class="item"><span>${d.name}<small>Fecha de vencimiento</small></span><input type="date" value="${d.due}" onchange="S.dates[${i}].due=this.value;save()"></div>`).join('')+
    `<div class="row" style="margin-top:1vh"><button class="btn tap" onclick="openFuel()">Registro de nafta</button></div>`);
}
function openFuel(){
  const f=S.fuel; let avg='--';
  const full=f.filter(x=>x.full);
  if(full.length>=2){ const a=full[0], b=full[full.length-1]; const km=b.odo-a.odo; const L=full.slice(1).reduce((s,x)=>s+x.liters,0); if(km>0) avg=(L/km*100).toFixed(1); }
  openModal(`<h2>Nafta <small>promedio real: ${avg} L/100 km</small></h2>
    <div class="item"><span>Cargué (litros)</span><span class="row"><input id="fl" type="number" step="0.01"><button class="btn go tap" onclick="addFuel(true)">Tanque lleno</button><button class="btn tap" onclick="addFuel(false)">Parcial</button></span></div>`+
    f.slice(-6).reverse().map(x=>`<div class="item"><span>${new Date(x.t).toLocaleDateString()} · ${x.liters} L<small>${fmtKm(x.odo)} km · ${x.full?'lleno':'parcial'}</small></span></div>`).join(''));
}
function addFuel(full){ const l=parseFloat($('fl').value); if(!(l>0)) return; S.fuel.push({t:Date.now(),liters:l,odo:S.odo,full}); save(); openFuel(); }

function openObd(){
  let body=`<h2>OBD2 <small>K3-VE</small></h2>
    <div class="grid4" style="margin-bottom:1.4vh">
      <div class="big"><b class="mono">${obd.temp!=null?Math.round(obd.temp)+'°':'--'}</b><small>Agua</small></div>
      <div class="big"><b class="mono">${obd.volt!=null?obd.volt.toFixed(1)+' V':'--'}</b><small>Batería</small></div>
      <div class="big"><b class="mono">${obd.iat!=null?Math.round(obd.iat)+'°':'--'}</b><small>Admisión</small></div>
      <div class="big"><b class="mono">${obd.mil==null?'--':obd.mil?'ON':'OFF'}</b><small>Check engine</small></div>
    </div>
    <div class="item"><span>MAF<small>Si el auto no lo reporta, L/100 queda en --</small></span><b class="mono">${obd.maf!=null?obd.maf.toFixed(1)+' g/s':'no disponible'}</b></div>
    <div class="row" style="margin:1.2vh 0"><button class="btn go tap" onclick="scanDtc()">Escanear códigos de falla</button><button class="btn amb tap" onclick="startSim()">Modo demo</button></div>
    <div id="dtcBox"></div>`;
  if(BT){ body+=`<h2 style="margin-top:1.6vh">Adaptadores emparejados</h2><div id="btList">Buscando…</div>`; }
  else body+=`<div class="item">La conexión Bluetooth funciona solo dentro de la APK.</div>`;
  openModal(body);
  renderDtc();
  if(BT) BT.list(l=>{ $('btList').innerHTML = l.length? l.map(d=>`<div class="item"><span>${d.name||'(sin nombre)'}<small>${d.address}</small></span><button class="btn go tap" onclick="connectObd('${d.address}')">Conectar</button></div>`).join('') : 'Emparejá primero el ELM327 en Ajustes de Android (PIN 1234 o 0000).'; }, ()=>{ $('btList').textContent='Error leyendo Bluetooth'; });
}
function setLook(k,v){ S[k]=v; save(); applyLook(); renderCar(); renderObd(); openSettings(); }
function editGreet(){ const g=prompt('Saludo (dejalo vacío para ocultarlo)', S.greet||''); if(g!==null) setLook('greet', g.trim()); }
function openSettings(){
  const sw=(list,key)=>`<span class="swatches">${list.map(b=>`<button class="sw tap ${S[key]===b[0]?'on':''}" style="--s:${b[0]}" onclick="setLook('${key}','${b[0]}')" aria-label="${b[1]}"></button>`).join('')}</span>`;
  const appRow=(k)=>(a,i)=>`<div class="item"><span>${a.n}<small>${a.pkg}${realIcons[a.pkg]?'':' · no instalada o sin detectar'}</small></span><button class="btn tap" onclick="editApp('${k}',${i})">Cambiar</button></div>`;
  openModal(`<h2>Ajustes del launcher</h2>`+
    `<div class="item"><span>Foto del auto<small>${carPhoto?'Usando tu foto':'Usando la ilustración'}</small></span><span class="row"><button class="btn go tap" onclick="pickCarPhoto()">Elegir foto</button>${carPhoto?`<button class="btn tap" onclick="clearCarPhoto()">Volver al dibujo</button>`:''}</span></div>`+
    `<div class="item"><span>Color del auto<small>${S.carColor}</small></span><span class="swatches">${Object.keys(CAR_COLORS).map(k=>`<button class="sw tap ${S.carColor===k?'on':''}" style="--s:${CAR_COLORS[k][1]}" onclick="setLook('carColor','${k}')" aria-label="${k}"></button>`).join('')}</span></div>`+
    `<div class="item"><span>Saludo<small>${S.greet||'(oculto)'}</small></span><button class="btn tap" onclick="editGreet()">Cambiar</button></div>`+
    `<div class="item"><span>Color de acento<small>${(ACCS.find(b=>b[0]===S.acc)||ACCS[0])[1]}</small></span>${sw(ACCS,'acc')}</div>`+
    `<div class="item"><span>Fondo<small>${(BGS.find(b=>b[0]===S.bg)||BGS[0])[1]}</small></span>${sw(BGS,'bg')}</div>`+
    `<div class="item"><span>Lado del volante<small>${S.side==='lhd'?'Izquierda: apps a la izquierda':'Derecha (Passo japonés): apps cerca tuyo'}</small></span><button class="btn tap" onclick="setLook('side','${S.side==='lhd'?'rhd':'lhd'}')">Invertir</button></div>`+
    `<div class="item"><span>Íconos de apps<small>${S.mono?'Monocromo':'Color original'}</small></span><button class="btn tap" onclick="S.mono=!S.mono;save();renderApps();openSettings()">${S.mono?'Pasar a color':'Pasar a monocromo'}</button></div>`+
    `<h2 style="margin-top:1.6vh">Apps de la derecha</h2>`+ S.apps.map(appRow('apps')).join('')+
    `<h2 style="margin-top:1.6vh">Dock de abajo</h2>`+ S.dock.map(appRow('dock')).join('')+
    `<h2 style="margin-top:1.6vh">Más apps</h2>`+ S.drawer.map(appRow('drawer')).join('')+
    `<div class="item"><span>Adaptador OBD guardado<small>${S.obdAddr||'ninguno'}</small></span>${S.obdAddr?`<button class="btn go tap" onclick="connectObd(S.obdAddr)">Reconectar</button>`:''}</div>`);
}
function editApp(k,i){
  const a=S[k][i];
  const n=prompt('Nombre del botón', a.n); if(n===null) return;
  const p=prompt('Paquete Android (ej. com.spotify.music)', a.pkg); if(p===null) return;
  a.n=n.trim()||a.n; a.pkg=p.trim()||a.pkg; save(); renderApps(); loadIcons().then(openSettings); openSettings();
}

/* ================= Noche ================= */
let night=false; function toggleNight(){ night=!night; $('night').style.opacity=night?.6:0; }

/* ================= Arranque ================= */
applyLook(); renderCar(); renderApps(); loadIcons(); renderShift(); renderObd();
document.addEventListener('deviceready',()=>{ BT = window.bluetoothSerial; loadIcons(); if(S.obdAddr && BT) connectObd(S.obdAddr); });
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) loadIcons(); });
</script>
</body>
</html>
